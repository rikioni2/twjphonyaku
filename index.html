<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>台湾華語トランスクライバー Pro</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- pinyin-pro (defer読込・安全ラッパー関数内からのみ参照) -->
  <script src="https://unpkg.com/pinyin-pro" defer></script>
  <style>
    /* ベースレイアウト・モバイル100dvh対応 */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #f3f5f9;
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .app-shell {
      height: 100vh;
      height: 100dvh;
    }

    /* 録音中パルスアニメーション */
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.55); }
      70% { box-shadow: 0 0 0 10px rgba(220, 38, 38, 0); }
      100% { box-shadow: 0 0 0 0 rgba(220, 38, 38, 0); }
    }
    .recording-pulse {
      animation: pulse-ring 1.5s infinite;
    }

    /* ローディングスピナー */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner {
      display: inline-block;
      width: 13px;
      height: 13px;
      border: 2px solid rgba(26, 86, 219, 0.25);
      border-top-color: #1a56db;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    /* モバイル下部セーフエリア余白 */
    .safe-bottom {
      padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
    }

    /* =========================================================
       高密度コンパクト字幕モード (mode === 'tw-translate')
       ========================================================= */
    #transcript-scroll.compact-mode {
      background-color: #ffffff;
      padding: 0;
    }
    #transcript-scroll.compact-mode #transcript-list {
      gap: 0;
      padding-bottom: 1.5rem;
    }
    #transcript-scroll.compact-mode .utterance-card {
      background-color: #ffffff;
      border: none;
      border-bottom: 1px solid #e5e7eb;
      border-radius: 0;
      box-shadow: none;
      padding: 5px 9px;
      margin: 0;
    }
    #transcript-scroll.compact-mode .utterance-card::after {
      content: '';
      display: table;
      clear: both;
    }
    #transcript-scroll.compact-mode .mode-pill {
      display: none !important;
    }
    /* 時刻を右端に小さく配置 */
    #transcript-scroll.compact-mode .card-header {
      float: right;
      margin: 0 0 0 8px;
      padding: 0;
      line-height: 1.32;
    }
    #transcript-scroll.compact-mode .card-time {
      font-size: 10px;
      color: #9ca3af;
      font-weight: 400;
    }
    /* 中国語原文は直上に小さく控えめなグレー */
    #transcript-scroll.compact-mode .orig-text {
      font-size: 11px;
      line-height: 1.28;
      font-weight: 400;
      color: #6b7280;
      margin-bottom: 1px;
    }
    /* 原文表示 OFF 時は中国語原文を非表示にして日本語訳で画面を埋める */
    #transcript-scroll.compact-mode.hide-original .orig-text {
      display: none !important;
    }
    #transcript-scroll.compact-mode .output-area {
      margin-top: 0;
      padding-top: 0;
      border-top: none;
    }
    /* 日本語訳を主役（濃いダーク文字・詰めた行間） */
    #transcript-scroll.compact-mode .trans-text {
      font-size: 14px;
      line-height: 1.32;
      font-weight: 600;
      color: #0f172a;
    }
    /* モデルバッジも高密度モードでは控えめなインライン表示 */
    #transcript-scroll.compact-mode .model-badge-row {
      margin-top: 1px;
    }
    #transcript-scroll.compact-mode .model-badge-pill {
      font-size: 9px;
      padding: 0 5px;
      background-color: transparent;
      color: #94a3b8;
    }
    #transcript-scroll.compact-mode .translating-row {
      font-size: 12px;
      line-height: 1.32;
      color: #6b7280;
      font-style: italic;
      gap: 5px;
    }
    #transcript-scroll.compact-mode .spinner {
      width: 11px;
      height: 11px;
      border-width: 1.5px;
    }
    #transcript-scroll.compact-mode .error-box {
      background-color: #fff1f2;
      border: 1px solid #fecdd3;
      border-radius: 6px;
      padding: 3px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }
    #transcript-scroll.compact-mode .error-msg {
      font-size: 11.5px;
      line-height: 1.3;
    }
    #transcript-scroll.compact-mode .card-retry-btn {
      padding: 2px 7px;
      font-size: 11px;
      border-radius: 5px;
    }
    /* 文字サイズ「小」オプション */
    #transcript-scroll.compact-mode.compact-size-sm .orig-text {
      font-size: 10px;
      line-height: 1.24;
    }
    #transcript-scroll.compact-mode.compact-size-sm .trans-text {
      font-size: 12.5px;
      line-height: 1.3;
    }
    /* コンパクトモード時のリアルタイム仮テキスト表示 */
    #transcript-scroll.compact-mode #interim-preview {
      border-radius: 0;
      border-left: none;
      border-right: none;
      border-top: none;
      border-bottom: 1px dashed #cbd5e1;
      box-shadow: none;
      padding: 5px 9px;
      margin: 0;
      background-color: #f8fafc;
    }
    #transcript-scroll.compact-mode #interim-preview-text {
      font-size: 12.5px;
      line-height: 1.3;
    }
  </style>
</head>
<body class="text-slate-800 overflow-hidden select-none">

  <!-- アプリ全体コンテナ -->
  <div class="app-shell flex flex-col w-full bg-[#f3f5f9]">

    <!-- ヘッダーバー・設定パネル・モード選択 -->
    <header class="bg-white border-b border-slate-200/90 px-3 pt-2.5 pb-2 shadow-sm shrink-0 z-20">
      <div class="max-w-2xl mx-auto space-y-2">

        <!-- タイトル & 設定ボタン行 -->
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-1.5 min-w-0">
            <span class="text-lg shrink-0" aria-hidden="true">🇹🇼</span>
            <h1 class="text-sm sm:text-base font-bold text-slate-900 truncate">
              台湾華語トランスクライバー Pro
            </h1>
          </div>

          <button
            type="button"
            id="settings-toggle-btn"
            aria-expanded="false"
            aria-controls="api-settings-drawer"
            class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl border border-slate-300 bg-slate-50 hover:bg-slate-100 active:bg-slate-200 text-xs font-semibold text-slate-700 transition shrink-0 cursor-pointer"
          >
            <span>⚙️ 設定</span>
            <span
              id="api-status-pill"
              class="px-1.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800"
            >
              未設定
            </span>
          </button>
        </div>

        <!-- 折りたたみ式 API設定パネル -->
        <section
          id="api-settings-drawer"
          class="hidden bg-slate-50 border border-slate-200 rounded-2xl p-3 space-y-2.5 max-h-[60vh] overflow-y-auto"
          aria-label="API設定"
        >
          <!-- Gemini APIキー入力 -->
          <div class="space-y-1">
            <div class="flex items-center justify-between">
              <label for="api-key-input" class="text-xs font-bold text-slate-700">
                Gemini APIキー（翻訳モードで必要）
              </label>
              <button
                type="button"
                id="toggle-key-eye-btn"
                class="text-xs font-semibold text-blue-600 hover:text-blue-800 px-1.5 py-0.5 rounded-lg hover:bg-blue-50 transition cursor-pointer"
              >
                👁️ 表示
              </button>
            </div>
            <input
              type="password"
              id="api-key-input"
              placeholder="AIzaSy... を貼り付け"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 select-text"
            >
          </div>

          <!-- モデル選択ドロップダウン -->
          <div class="space-y-1">
            <div class="flex items-center justify-between gap-2">
              <label for="model-select" class="text-xs font-bold text-slate-700">
                翻訳AIモデル
              </label>
              <span id="sticky-model-hint" class="text-[11px] font-medium text-slate-500 truncate">
                最速モード（3.5-flash-lite優先）
              </span>
            </div>
            <div class="relative">
              <select
                id="model-select"
                class="w-full appearance-none bg-white border border-slate-300 text-slate-800 font-semibold text-xs sm:text-sm rounded-xl px-3 py-2 pr-8 focus:outline-none focus:ring-2 focus:ring-blue-500 transition cursor-pointer"
              >
                <option value="auto">自動（最速モデル優先）</option>
              </select>
              <span class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-slate-500 text-xs">
                ▼
              </span>
            </div>
          </div>

          <!-- 保存・リセットボタン行 -->
          <div class="grid grid-cols-2 gap-2">
            <button
              type="button"
              id="save-api-btn"
              class="py-2 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white text-xs sm:text-sm font-bold shadow-sm transition cursor-pointer"
            >
              💾 保存
            </button>
            <button
              type="button"
              id="reset-api-btn"
              class="py-2 px-3 rounded-xl bg-rose-600 hover:bg-rose-700 active:scale-[0.98] text-white text-xs sm:text-sm font-bold shadow-sm transition cursor-pointer"
            >
              🗑️ リセット
            </button>
          </div>

          <!-- 接続テスト＆モデル取得ボタン -->
          <button
            type="button"
            id="test-api-btn"
            class="w-full py-2 px-3 rounded-xl bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white text-xs sm:text-sm font-bold shadow-sm transition cursor-pointer"
          >
            🔌 接続テスト＆モデル取得
          </button>

          <!-- インラインステータスフィードバック -->
          <div
            id="api-inline-status"
            class="text-xs font-medium text-slate-600 leading-relaxed break-words min-h-[1rem]"
          ></div>
        </section>

        <!-- モード選択ドロップダウン -->
        <div class="relative">
          <select
            id="mode-select"
            aria-label="文字起こし・翻訳モード選択"
            class="w-full appearance-none bg-blue-50/90 border border-blue-200 text-blue-950 font-bold text-xs sm:text-sm rounded-xl px-3 py-2 pr-8 focus:outline-none focus:ring-2 focus:ring-blue-500 transition cursor-pointer"
          >
            <option value="tw-practice">🇹🇼 台湾華語（発音練習・ピンイン付）</option>
            <option value="tw-translate">🇹🇼→🇯🇵 台湾華語（日本語へ翻訳・高密度）</option>
            <option value="jp-to-tw">🇯🇵→🇹🇼 日本語（台湾華語へ翻訳+ピンイン）</option>
            <option value="en-translate">🇺🇸→🇯🇵 英語（日本語へ翻訳）</option>
          </select>
          <span class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-blue-700 text-xs">
            ▼
          </span>
        </div>

        <!-- 高密度モード専用ツールバー (tw-translate 時のみ表示) -->
        <div
          id="compact-options-bar"
          class="hidden flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-xl bg-slate-100 border border-slate-200/80 text-xs"
        >
          <span class="font-bold text-slate-600 truncate">📺 字幕モード</span>
          <div class="flex items-center gap-1.5 shrink-0">
            <button
              type="button"
              id="toggle-original-btn"
              class="px-2.5 py-1 rounded-lg font-bold border transition cursor-pointer bg-blue-600 text-white border-blue-600"
            >
              原文: ON
            </button>
            <button
              type="button"
              id="toggle-fontsize-btn"
              class="px-2.5 py-1 rounded-lg font-bold border transition cursor-pointer bg-white text-slate-700 border-slate-300 hover:bg-slate-50"
            >
              文字: 中
            </button>
          </div>
        </div>

      </div>
    </header>

    <!-- 会話タイムライン領域 -->
    <div class="relative flex-1 min-h-0 flex flex-col">
      <main id="transcript-scroll" class="flex-1 overflow-y-auto px-3 py-2.5">
        <div id="transcript-list" class="max-w-2xl mx-auto flex flex-col gap-2.5 pb-4">
          <!-- 空状態ガイドカード -->
          <div
            id="empty-state-card"
            class="bg-white border border-dashed border-slate-300 rounded-2xl p-5 text-center text-slate-500 mt-3 mx-3 shadow-sm"
          >
            <div class="text-2xl mb-1.5" aria-hidden="true">🎤</div>
            <p id="empty-state-title" class="text-sm font-bold text-slate-700 mb-1">
              台湾華語（発音練習・ピンイン付）モード
            </p>
            <p id="empty-state-desc" class="text-xs leading-relaxed text-slate-500">
              下の「🎤 録音開始」を押して台湾華語を話すと、繁体字と声調記号付きピンインが表示されます（APIキー不要）。
            </p>
          </div>

          <!-- ライブ仮テキストプレビュー（発話中のみ表示） -->
          <div
            id="interim-preview"
            class="hidden bg-white/95 border border-dashed border-blue-300 rounded-2xl px-3.5 py-2.5 shadow-sm"
          >
            <div class="flex items-center gap-1.5 text-[11px] font-bold text-blue-600 mb-0.5">
              <span class="inline-block w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></span>
              <span>聞き取り中...</span>
            </div>
            <div id="interim-preview-text" class="text-base font-medium text-slate-500 italic break-words"></div>
          </div>
        </div>
      </main>

      <!-- 上へスクロール中に表示される「↓ 最新へ」ボタン -->
      <button
        type="button"
        id="scroll-bottom-btn"
        class="hidden absolute bottom-3 right-3 z-30 px-3 py-1.5 rounded-full bg-slate-900/85 hover:bg-slate-900 text-white text-xs font-bold shadow-lg backdrop-blur-sm transition active:scale-95 cursor-pointer"
      >
        ↓ 最新へ
      </button>
    </div>

    <!-- 下部固定コントロールバー -->
    <footer class="bg-white border-t border-slate-200/90 px-3 pt-2 safe-bottom shrink-0 z-20 shadow-[0_-3px_10px_rgba(15,23,42,0.05)]">
      <div class="max-w-2xl mx-auto space-y-2">
        <!-- プライマリ録音開始/停止ボタン -->
        <button
          type="button"
          id="mic-btn"
          class="w-full py-3 px-4 rounded-xl bg-[#16a34a] hover:bg-[#15803d] active:scale-[0.99] text-white font-bold text-sm sm:text-base shadow-sm flex items-center justify-center gap-2 transition cursor-pointer"
        >
          <span id="mic-btn-icon" aria-hidden="true">🎤</span>
          <span id="mic-btn-label">録音開始</span>
        </button>

        <!-- セカンダリボタン行（全コピー・クリア） -->
        <div class="grid grid-cols-2 gap-2">
          <button
            type="button"
            id="copy-btn"
            class="py-2 px-3 rounded-xl bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold text-xs sm:text-sm shadow-sm flex items-center justify-center gap-1.5 transition cursor-pointer"
          >
            <span aria-hidden="true">📋</span>
            <span>全コピー</span>
          </button>
          <button
            type="button"
            id="clear-btn"
            class="py-2 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 active:scale-[0.98] text-slate-700 border border-slate-300 font-bold text-xs sm:text-sm shadow-sm flex items-center justify-center gap-1.5 transition cursor-pointer"
          >
            <span aria-hidden="true">🗑️</span>
            <span>クリア</span>
          </button>
        </div>
      </div>
    </footer>

  </div>

  <!-- ボトムトースト通知（alert / confirm は一切不使用） -->
  <div
    id="toast"
    role="status"
    aria-live="polite"
    class="fixed bottom-28 left-1/2 -translate-x-1/2 translate-y-2 opacity-0 pointer-events-none bg-slate-900/95 text-white text-xs sm:text-sm font-semibold px-4 py-2 rounded-full shadow-lg transition-all duration-200 z-50 max-w-[92vw] text-center"
  ></div>

  <script>
    /**
     * 台湾華語トランスクライバー Pro
     * - 全イベントを init() 内で登録（インライン onclick 不使用）
     * - pinyinPro・4層ストレージすべて個別 try/catch ガードでクラッシュ防止
     * - Android Chrome 音声認識安定化（仮テキスト救済・3.5秒ウォッチドッグ・280msクールタイム・自動復帰）
     * - Gemini API 最速モデル優先＋スティッキー記憶＋6秒タイムアウト＋即時フォールバック
     */
    (function () {
      'use strict';

      // =========================================================
      // 1. 定数・モード定義
      // =========================================================
      const WINDOW_NAME_PREFIX = 'TW_TRANSCRIBER_PRO::';
      const STORAGE_PREFIX = 'tw_transcriber_pro_v5_';
      const KEY_API = STORAGE_PREFIX + 'api_key';
      const KEY_STICKY_MODEL = STORAGE_PREFIX + 'sticky_model';
      const KEY_MODEL_OVERRIDE = STORAGE_PREFIX + 'model_override';
      const KEY_SHOW_ORIGINAL = STORAGE_PREFIX + 'show_original';
      const KEY_COMPACT_SIZE = STORAGE_PREFIX + 'compact_size';

      const FETCH_TIMEOUT_MS = 6000;
      const AUTO_SCROLL_THRESHOLD_PX = 80;
      const WATCHDOG_MS = 3500;
      const RESTART_COOLDOWN_MS = 280;
      const DEDUP_WINDOW_MS = 1500;
      const ERROR_BACKOFF_STEP_MS = 500;
      const ERROR_BACKOFF_MAX_MS = 2000;

      const PRESET_MODELS = [
        'gemini-3.5-flash-lite',
        'gemini-3.5-flash',
        'gemini-2.5-flash-lite',
        'gemini-2.5-flash',
        'gemini-3.8-flash'
      ];

      const EXCLUDED_MODEL_REGEX = /(embedding|imagen|veo|aqa|tts|audio|whisper|vision|robotics|computer-use|learnlm)/i;

      const MODES = {
        'tw-practice': {
          lang: 'zh-TW',
          pill: '台湾華語 発音',
          pillClass: 'bg-emerald-100 text-emerald-800',
          title: '台湾華語（発音練習・ピンイン付）モード',
          desc: '下の「🎤 録音開始」を押して台湾華語を話すと、繁体字と声調記号付きピンインが表示されます（APIキー不要）。'
        },
        'tw-translate': {
          lang: 'zh-TW',
          pill: '台湾華語→日本語',
          pillClass: 'bg-blue-100 text-blue-800',
          title: '台湾華語（日本語へ翻訳・高密度）モード',
          desc: '台湾人同士の会話をリアルタイム字幕のように高密度で日本語訳します。上のボタンで「原文表示」や「文字サイズ」を切り替えできます。'
        },
        'jp-to-tw': {
          lang: 'ja-JP',
          pill: '日本語→台湾華語',
          pillClass: 'bg-indigo-100 text-indigo-800',
          title: '日本語（台湾華語へ翻訳+ピンイン）モード',
          desc: '日本語で話すと、自然な台湾華語（繁体字）と声調記号付きピンインに翻訳して表示します。'
        },
        'en-translate': {
          lang: 'en-US',
          pill: '英語→日本語',
          pillClass: 'bg-violet-100 text-violet-800',
          title: '英語（日本語へ翻訳）モード',
          desc: '聞き取った英語を書き出し、自然な日本語訳を表示します。'
        }
      };

      // =========================================================
      // 2. アプリケーション状態
      // =========================================================
      let apiKey = '';
      let stickyModel = '';
      let selectedModel = 'auto';
      let discoveredModels = [];
      let showOriginal = true;
      let compactSize = 'md'; // 'md' | 'sm'

      // 音声認識状態フラグ
      let recognition = null;
      let shouldBeRecording = false;
      let isRecognitionActive = false;
      let restartTimer = null;
      let watchdogTimer = null;
      let errorRetryCount = 0;
      let pendingBackoffMs = 0;

      // 仮テキスト救済・二重確定防止状態
      let utteranceCommitted = false;
      let activeUtteranceMode = 'tw-practice';
      let lastInterimText = '';
      let bestInterimText = '';
      let lastCommittedText = '';
      let lastCommittedAt = 0;

      let toastTimer = null;

      // DOM 要素参照マップ
      const dom = {};

      // =========================================================
      // 3. 安全ヘルパー関数
      // =========================================================

      /**
       * pinyin-pro を安全に呼び出すヘルパー（未読込・失敗時は空文字）
       */
      function toPinyin(text) {
        try {
          const fn = window.pinyinPro?.pinyin;
          if (typeof fn === 'function') {
            return fn(String(text || ''), { toneType: 'symbol' }) || '';
          }
        } catch (e) {}
        return '';
      }

      function normalizeKey(raw) {
        return String(raw || '').replace(/\s+/g, '');
      }

      function escapeHtml(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatTime() {
        const now = new Date();
        const pad = (n) => String(n).padStart(2, '0');
        return `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
      }

      function showToast(message) {
        if (!dom.toast) return;
        dom.toast.textContent = String(message || '');
        dom.toast.classList.remove('opacity-0', 'translate-y-2');
        dom.toast.classList.add('opacity-100', 'translate-y-0');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          if (!dom.toast) return;
          dom.toast.classList.remove('opacity-100', 'translate-y-0');
          dom.toast.classList.add('opacity-0', 'translate-y-2');
        }, 2500);
      }

      // =========================================================
      // 4. 4層ストレージ保存・復元（すべて個別 try/catch ガード）
      // =========================================================

      function readWindowNameMap() {
        try {
          if (typeof window.name === 'string' && window.name.startsWith(WINDOW_NAME_PREFIX)) {
            const parsed = JSON.parse(window.name.slice(WINDOW_NAME_PREFIX.length));
            if (parsed && typeof parsed === 'object') return parsed;
          }
        } catch (e) {}
        return {};
      }

      function storageSet(key, value) {
        const strVal = String(value || '');

        // 1) localStorage
        try {
          if (strVal) window.localStorage.setItem(key, strVal);
          else window.localStorage.removeItem(key);
        } catch (e) {}

        // 2) sessionStorage
        try {
          if (strVal) window.sessionStorage.setItem(key, strVal);
          else window.sessionStorage.removeItem(key);
        } catch (e) {}

        // 3) window.name (JSON prefix)
        try {
          const map = readWindowNameMap();
          if (strVal) map[key] = strVal;
          else delete map[key];
          window.name = WINDOW_NAME_PREFIX + JSON.stringify(map);
        } catch (e) {}

        // 4) document.cookie
        try {
          if (strVal) {
            document.cookie = `${key}=${encodeURIComponent(strVal)}; path=/; max-age=2592000; SameSite=Lax`;
          } else {
            document.cookie = `${key}=; path=/; max-age=0; SameSite=Lax`;
          }
        } catch (e) {}
      }

      function storageGet(key) {
        let value = '';

        // 1) localStorage
        if (!value) {
          try {
            const v = window.localStorage.getItem(key);
            if (v) value = String(v);
          } catch (e) {}
        }

        // 2) sessionStorage
        if (!value) {
          try {
            const v = window.sessionStorage.getItem(key);
            if (v) value = String(v);
          } catch (e) {}
        }

        // 3) window.name
        if (!value) {
          try {
            const map = readWindowNameMap();
            if (typeof map[key] === 'string' && map[key]) {
              value = map[key];
            }
          } catch (e) {}
        }

        // 4) document.cookie
        if (!value) {
          try {
            const parts = String(document.cookie || '').split(';');
            for (let i = 0; i < parts.length; i++) {
              const pair = parts[i].trim();
              if (pair.startsWith(key + '=')) {
                value = decodeURIComponent(pair.slice(key.length + 1));
                break;
              }
            }
          } catch (e) {}
        }

        if (value) storageSet(key, value);
        return value;
      }

      function loadSettings() {
        // 旧キー互換も含めて安全に復元
        apiKey = normalizeKey(
          storageGet(KEY_API) ||
          storageGet('tw_transcriber_pro_v4_api_key') ||
          storageGet('tw_transcriber_pro_v3_api_key')
        );
        if (apiKey) storageSet(KEY_API, apiKey);

        stickyModel = (
          storageGet(KEY_STICKY_MODEL) ||
          storageGet('tw_transcriber_pro_v4_last_working_model')
        ).trim();

        selectedModel = storageGet(KEY_MODEL_OVERRIDE).trim() || 'auto';
        showOriginal = storageGet(KEY_SHOW_ORIGINAL) !== 'off';
        compactSize = storageGet(KEY_COMPACT_SIZE) === 'sm' ? 'sm' : 'md';

        if (dom.apiKeyInput && apiKey) {
          dom.apiKeyInput.value = apiKey;
        }
        updateApiStatusBadge();
        renderModelOptions();
        updateStickyHint();
        updateCompactToolbarUI();
      }

      function saveApiKey(rawKey) {
        apiKey = normalizeKey(rawKey);
        storageSet(KEY_API, apiKey);
        if (dom.apiKeyInput) dom.apiKeyInput.value = apiKey;
        updateApiStatusBadge();
      }

      function saveStickyModel(modelName) {
        stickyModel = String(modelName || '').trim();
        storageSet(KEY_STICKY_MODEL, stickyModel);
        updateStickyHint();
      }

      function saveSelectedModel(val) {
        selectedModel = String(val || 'auto').trim() || 'auto';
        storageSet(KEY_MODEL_OVERRIDE, selectedModel === 'auto' ? '' : selectedModel);
        updateStickyHint();
      }

      function updateApiStatusBadge() {
        if (!dom.apiStatusPill) return;
        if (apiKey) {
          dom.apiStatusPill.textContent = '設定済み';
          dom.apiStatusPill.className = 'px-1.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800';
        } else {
          dom.apiStatusPill.textContent = '未設定';
          dom.apiStatusPill.className = 'px-1.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800';
        }
      }

      function updateStickyHint() {
        if (!dom.stickyModelHint) return;
        if (selectedModel !== 'auto') {
          dom.stickyModelHint.textContent = `手動固定: ${selectedModel}`;
        } else if (stickyModel) {
          dom.stickyModelHint.textContent = `優先記憶: ⚡ ${stickyModel}`;
        } else {
          dom.stickyModelHint.textContent = '最速モード（3.5-flash-lite優先）';
        }
      }

      function setInlineStatus(text, tone) {
        if (!dom.apiInlineStatus) return;
        dom.apiInlineStatus.textContent = text || '';
        const base = 'text-xs leading-relaxed break-words min-h-[1rem] ';
        if (tone === 'success') {
          dom.apiInlineStatus.className = base + 'font-semibold text-emerald-700';
        } else if (tone === 'error') {
          dom.apiInlineStatus.className = base + 'font-semibold text-rose-600';
        } else if (tone === 'info') {
          dom.apiInlineStatus.className = base + 'font-semibold text-blue-700';
        } else {
          dom.apiInlineStatus.className = base + 'font-medium text-slate-600';
        }
      }

      function renderModelOptions() {
        if (!dom.modelSelect) return;
        const list = [];
        PRESET_MODELS.forEach((m) => { if (!list.includes(m)) list.push(m); });
        discoveredModels.forEach((m) => { if (!list.includes(m)) list.push(m); });
        if (selectedModel !== 'auto' && !list.includes(selectedModel)) {
          list.push(selectedModel);
        }

        dom.modelSelect.innerHTML = '';
        const autoOpt = document.createElement('option');
        autoOpt.value = 'auto';
        autoOpt.textContent = '自動（最速モデル優先）';
        dom.modelSelect.appendChild(autoOpt);

        list.forEach((modelName) => {
          const opt = document.createElement('option');
          opt.value = modelName;
          opt.textContent = modelName;
          dom.modelSelect.appendChild(opt);
        });

        dom.modelSelect.value = list.includes(selectedModel) ? selectedModel : 'auto';
      }

      // =========================================================
      // 5. スマート自動スクロール制御
      // =========================================================

      function isNearBottom() {
        if (!dom.transcriptScroll) return true;
        const { scrollHeight, scrollTop, clientHeight } = dom.transcriptScroll;
        return (scrollHeight - scrollTop - clientHeight) <= AUTO_SCROLL_THRESHOLD_PX;
      }

      function syncScrollBottomBtn() {
        if (!dom.scrollBottomBtn || !dom.transcriptScroll) return;
        const canScroll = dom.transcriptScroll.scrollHeight > dom.transcriptScroll.clientHeight + 40;
        if (canScroll && !isNearBottom()) {
          dom.scrollBottomBtn.classList.remove('hidden');
        } else {
          dom.scrollBottomBtn.classList.add('hidden');
        }
      }

      function autoScrollIfPinned(wasNearBottom) {
        if (!wasNearBottom || !dom.transcriptScroll) return;
        requestAnimationFrame(() => {
          if (!dom.transcriptScroll) return;
          dom.transcriptScroll.scrollTop = dom.transcriptScroll.scrollHeight;
          syncScrollBottomBtn();
        });
      }

      // =========================================================
      // 6. モード別レイアウト & 高密度オプション制御
      // =========================================================

      function applyModeLayout() {
        if (!dom.modeSelect || !dom.transcriptScroll || !dom.compactOptionsBar) return;
        const mode = dom.modeSelect.value;
        const isCompact = mode === 'tw-translate';

        dom.transcriptScroll.classList.toggle('compact-mode', isCompact);
        dom.compactOptionsBar.classList.toggle('hidden', !isCompact);

        const meta = MODES[mode] || MODES['tw-practice'];
        if (dom.emptyStateTitle) dom.emptyStateTitle.textContent = meta.title;
        if (dom.emptyStateDesc) dom.emptyStateDesc.textContent = meta.desc;

        updateCompactToolbarUI();
        syncScrollBottomBtn();
      }

      function updateCompactToolbarUI() {
        if (!dom.transcriptScroll) return;
        dom.transcriptScroll.classList.toggle('hide-original', !showOriginal);
        dom.transcriptScroll.classList.toggle('compact-size-sm', compactSize === 'sm');

        if (dom.toggleOriginalBtn) {
          dom.toggleOriginalBtn.textContent = showOriginal ? '原文: ON' : '原文: OFF';
          dom.toggleOriginalBtn.className = showOriginal
            ? 'px-2.5 py-1 rounded-lg font-bold border transition cursor-pointer bg-blue-600 text-white border-blue-600'
            : 'px-2.5 py-1 rounded-lg font-bold border transition cursor-pointer bg-white text-slate-600 border-slate-300 hover:bg-slate-50';
        }

        if (dom.toggleFontSizeBtn) {
          dom.toggleFontSizeBtn.textContent = compactSize === 'sm' ? '文字: 小' : '文字: 中';
          dom.toggleFontSizeBtn.className = compactSize === 'sm'
            ? 'px-2.5 py-1 rounded-lg font-bold border transition cursor-pointer bg-slate-800 text-white border-slate-800'
            : 'px-2.5 py-1 rounded-lg font-bold border transition cursor-pointer bg-white text-slate-700 border-slate-300 hover:bg-slate-50';
        }
      }

      // =========================================================
      // 7. Gemini API 高速翻訳エンジン
      // =========================================================

      async function fetchWithTimeout(url, options) {
        const controller = new AbortController();
        const timerId = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
        try {
          return await fetch(url, Object.assign({}, options, { signal: controller.signal }));
        } catch (err) {
          if (err && err.name === 'AbortError') {
            const timeoutErr = new Error('タイムアウト (6秒)');
            timeoutErr.isTimeout = true;
            throw timeoutErr;
          }
          throw err;
        } finally {
          clearTimeout(timerId);
        }
      }

      function isInvalidKeyError(err) {
        if (!err) return false;
        const msg = `${err.message || ''} ${err.rawMessage || ''} ${err.apiStatus || ''}`;
        return (
          (err.status === 400 || err.status === 401 || err.status === 403) &&
          /(API_KEY_INVALID|API key not valid|API key expired|INVALID_ARGUMENT.*API key)/i.test(msg)
        );
      }

      async function callSingleModel(model, prompt, key) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent?key=${encodeURIComponent(key)}`;
        const response = await fetchWithTimeout(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }]
          })
        });

        let data = {};
        try {
          data = await response.json();
        } catch (e) {
          data = {};
        }

        if (!response.ok) {
          const detail = data?.error?.message || response.statusText || 'APIエラー';
          const err = new Error(`HTTP ${response.status}: ${detail}`);
          err.status = response.status;
          err.apiStatus = data?.error?.status || '';
          err.rawMessage = detail;
          throw err;
        }

        const out = data?.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
        if (!out) {
          throw new Error('翻訳結果が空でした');
        }
        return out;
      }

      async function discoverAvailableModels(key) {
        const url = `https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`;
        const response = await fetchWithTimeout(url, { method: 'GET' });

        let data = {};
        try {
          data = await response.json();
        } catch (e) {
          data = {};
        }

        if (!response.ok) {
          const detail = data?.error?.message || response.statusText || 'モデル一覧の取得に失敗しました';
          const err = new Error(`HTTP ${response.status}: ${detail}`);
          err.status = response.status;
          err.apiStatus = data?.error?.status || '';
          err.rawMessage = detail;
          throw err;
        }

        const rawList = Array.isArray(data.models) ? data.models : [];
        const candidates = rawList
          .filter((item) => {
            const methods = Array.isArray(item.supportedGenerationMethods) ? item.supportedGenerationMethods : [];
            if (!methods.includes('generateContent')) return false;
            const name = String(item.name || '').replace(/^models\//, '');
            if (!name.toLowerCase().includes('gemini')) return false;
            if (EXCLUDED_MODEL_REGEX.test(name)) return false;
            return true;
          })
          .map((item) => String(item.name || '').replace(/^models\//, ''));

        const unique = Array.from(new Set(candidates));
        unique.sort((a, b) => {
          const rank = (name) => {
            const lower = name.toLowerCase();
            if (lower === 'gemini-3.5-flash-lite') return 0;
            if (lower.includes('flash-lite')) return 1;
            if (lower.includes('lite')) return 2;
            if (lower.includes('flash')) return 3;
            if (lower.includes('pro')) return 4;
            return 5;
          };
          const diff = rank(a) - rank(b);
          return diff !== 0 ? diff : a.localeCompare(b);
        });

        discoveredModels = unique;
        renderModelOptions();
        return unique;
      }

      function buildModelQueue() {
        if (selectedModel && selectedModel !== 'auto') {
          return [selectedModel];
        }
        const queue = [];
        if (stickyModel) queue.push(stickyModel);
        PRESET_MODELS.forEach((m) => { if (!queue.includes(m)) queue.push(m); });
        return queue;
      }

      async function callGeminiTranslate(prompt, key, onProgress) {
        const queue = buildModelQueue();
        const tried = new Set();
        let lastError = null;

        for (let i = 0; i < queue.length; i++) {
          const model = queue[i];
          tried.add(model);
          if (typeof onProgress === 'function') onProgress(`翻訳中... (${model})`);

          try {
            const text = await callSingleModel(model, prompt, key);
            saveStickyModel(model);
            return { text, model };
          } catch (err) {
            if (isInvalidKeyError(err)) {
              throw new Error('APIキーが無効です。設定画面で正しいGemini APIキーを確認してください。');
            }
            lastError = new Error(`[${model}] ${err.message || '通信エラー'}`);
          }
        }

        // 自動モードで全プリセットモデルが失敗した場合のみ ListModels で代替を検索
        if (selectedModel === 'auto') {
          if (typeof onProgress === 'function') onProgress('利用可能な代替モデルを検索中...');
          try {
            const available = await discoverAvailableModels(key);
            const extras = available.filter((m) => !tried.has(m)).slice(0, 3);
            for (let i = 0; i < extras.length; i++) {
              const model = extras[i];
              if (typeof onProgress === 'function') onProgress(`翻訳中... (${model})`);
              try {
                const text = await callSingleModel(model, prompt, key);
                saveStickyModel(model);
                return { text, model };
              } catch (err) {
                if (isInvalidKeyError(err)) {
                  throw new Error('APIキーが無効です。設定画面で正しいGemini APIキーを確認してください。');
                }
                lastError = new Error(`[${model}] ${err.message || '通信エラー'}`);
              }
            }
          } catch (listErr) {
            if (isInvalidKeyError(listErr)) {
              throw new Error('APIキーが無効です。設定画面で正しいGemini APIキーを確認してください。');
            }
            if (!lastError) lastError = listErr;
          }
        }

        throw lastError || new Error('翻訳モデルに接続できませんでした');
      }

      function buildPrompt(text, mode) {
        if (mode === 'tw-translate') {
          return `Translate the following Taiwanese Mandarin into natural, concise Japanese. Output ONLY the Japanese translation.\n\n${text}`;
        }
        if (mode === 'jp-to-tw') {
          return `Translate the following Japanese into natural Taiwanese Mandarin (Traditional Chinese / 繁体字). Output ONLY the Traditional Chinese text.\n\n${text}`;
        }
        if (mode === 'en-translate') {
          return `Translate the following English into natural Japanese. Output ONLY the Japanese translation.\n\n${text}`;
        }
        return text;
      }

      // =========================================================
      // 8. 会話アイテム描画・翻訳実行
      // =========================================================

      /**
       * 1.5秒以内の同一文重複を除外しながら確定発話を追加する
       */
      function commitUtterance(text, mode) {
        const trimmed = String(text || '').trim();
        if (!trimmed) return false;

        const now = Date.now();
        if (trimmed === lastCommittedText && (now - lastCommittedAt) < DEDUP_WINDOW_MS) {
          return false;
        }
        lastCommittedText = trimmed;
        lastCommittedAt = now;

        renderUtteranceCard(trimmed, mode);
        return true;
      }

      function renderUtteranceCard(text, mode) {
        const pinned = isNearBottom();
        if (dom.emptyStateCard) dom.emptyStateCard.classList.add('hidden');

        const meta = MODES[mode] || MODES['tw-practice'];
        const timeStr = formatTime();

        const card = document.createElement('article');
        card.className = 'utterance-card bg-white rounded-2xl border border-slate-200/90 p-3.5 shadow-sm';
        card.dataset.mode = mode;
        card.dataset.time = timeStr;
        card.innerHTML = `
          <div class="card-header flex items-center justify-between gap-2 mb-1.5">
            <span class="mode-pill px-2.5 py-0.5 rounded-full text-[11px] font-bold ${meta.pillClass}">
              ${escapeHtml(meta.pill)}
            </span>
            <span class="card-time text-[11px] font-medium text-slate-400">${escapeHtml(timeStr)}</span>
          </div>
          <div class="orig-text text-xl sm:text-2xl font-bold text-slate-900 leading-snug break-words select-text">${escapeHtml(text)}</div>
          <div class="orig-pinyin text-sm text-slate-500 font-mono mt-1 leading-relaxed break-words select-text hidden"></div>
          <div class="output-area mt-2.5 pt-2.5 border-t border-slate-100 hidden"></div>
        `;

        if (dom.transcriptList && dom.interimPreview) {
          dom.transcriptList.insertBefore(card, dom.interimPreview);
        } else if (dom.transcriptList) {
          dom.transcriptList.appendChild(card);
        }

        if (mode === 'tw-practice') {
          const py = toPinyin(text);
          const pyEl = card.querySelector('.orig-pinyin');
          if (py && pyEl) {
            pyEl.textContent = py;
            pyEl.classList.remove('hidden');
          }
        } else {
          translateCard(text, mode, card);
        }

        autoScrollIfPinned(pinned);
        syncScrollBottomBtn();
      }

      async function translateCard(text, mode, card) {
        const outputArea = card.querySelector('.output-area');
        if (!outputArea) return;
        outputArea.classList.remove('hidden');

        // 入力欄に未保存のキーがあれば自動保存して利用
        const inputVal = normalizeKey(dom.apiKeyInput ? dom.apiKeyInput.value : '');
        if (inputVal && inputVal !== apiKey) {
          saveApiKey(inputVal);
        }
        const activeKey = apiKey;

        if (!activeKey) {
          renderCardError(
            outputArea,
            'APIキーが未設定です。右上の「⚙️ 設定」からGemini APIキーを保存してください。',
            text,
            mode,
            card
          );
          return;
        }

        const prompt = buildPrompt(text, mode);

        try {
          const { text: translated, model: usedModel } = await callGeminiTranslate(
            prompt,
            activeKey,
            (statusText) => {
              const pinned = isNearBottom();
              const isCompact = dom.modeSelect && dom.modeSelect.value === 'tw-translate';
              const label = isCompact ? '翻訳中...' : statusText;
              outputArea.innerHTML = `
                <div class="translating-row flex items-center gap-2 text-xs sm:text-sm font-medium text-slate-500">
                  <span class="spinner" aria-hidden="true"></span>
                  <span class="truncate">${escapeHtml(label)}</span>
                </div>
              `;
              autoScrollIfPinned(pinned);
            }
          );

          const pinned = isNearBottom();
          let html = `
            <div class="trans-text text-base sm:text-lg font-bold text-[#1a56db] leading-relaxed break-words select-text">
              ${escapeHtml(translated)}
            </div>
          `;

          if (mode === 'jp-to-tw') {
            const py = toPinyin(translated);
            if (py) {
              html += `
                <div class="trans-pinyin text-sm text-slate-500 font-mono mt-1 leading-relaxed break-words select-text">
                  ${escapeHtml(py)}
                </div>
              `;
            }
          }

          html += `
            <div class="model-badge-row mt-1.5 flex justify-end">
              <span class="model-badge-pill inline-flex items-center gap-1 px-2 py-0.5 rounded-md bg-slate-100 text-slate-500 text-[10px] font-semibold">
                <span aria-hidden="true">⚡</span>
                <span>${escapeHtml(usedModel)}</span>
              </span>
            </div>
          `;

          outputArea.innerHTML = html;
          autoScrollIfPinned(pinned);
          syncScrollBottomBtn();
        } catch (err) {
          renderCardError(outputArea, err.message || '翻訳に失敗しました', text, mode, card);
        }
      }

      function renderCardError(outputArea, message, originalText, mode, card) {
        const pinned = isNearBottom();
        outputArea.innerHTML = `
          <div class="error-box bg-rose-50 border border-rose-200 rounded-xl p-2.5 space-y-1.5">
            <div class="error-msg text-xs sm:text-sm font-semibold text-rose-700 leading-relaxed break-words">
              ⚠️ ${escapeHtml(message)}
            </div>
            <button
              type="button"
              class="card-retry-btn inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-white border border-rose-300 text-rose-700 hover:bg-rose-100 active:scale-[0.98] text-xs font-bold shadow-sm transition cursor-pointer shrink-0"
            >
              🔄 再試行
            </button>
          </div>
        `;

        const retryBtn = outputArea.querySelector('.card-retry-btn');
        if (retryBtn) {
          retryBtn.addEventListener('click', () => {
            translateCard(originalText, mode, card);
          });
        }
        autoScrollIfPinned(pinned);
        syncScrollBottomBtn();
      }

      function setInterimPreview(text) {
        if (!dom.interimPreview || !dom.interimPreviewText) return;
        const trimmed = String(text || '').trim();
        const pinned = isNearBottom();

        if (trimmed) {
          if (dom.emptyStateCard) dom.emptyStateCard.classList.add('hidden');
          dom.interimPreviewText.textContent = trimmed;
          dom.interimPreview.classList.remove('hidden');
          autoScrollIfPinned(pinned);
        } else {
          dom.interimPreviewText.textContent = '';
          dom.interimPreview.classList.add('hidden');
        }
      }

      // =========================================================
      // 9. Android Chrome 安定化 音声認識エンジン
      // =========================================================

      function clearTimers() {
        if (restartTimer) {
          clearTimeout(restartTimer);
          restartTimer = null;
        }
        if (watchdogTimer) {
          clearTimeout(watchdogTimer);
          watchdogTimer = null;
        }
      }

      /**
       * 録音ボタンの表示状態を更新 ('idle' | 'listening' | 'recognizing' | 'reconnecting')
       */
      function updateMicButtonUI(state) {
        if (!dom.micBtn || !dom.micBtnIcon || !dom.micBtnLabel) return;

        if (state === 'idle') {
          dom.micBtn.classList.remove('bg-rose-600', 'hover:bg-rose-700', 'recording-pulse');
          dom.micBtn.classList.add('bg-[#16a34a]', 'hover:bg-[#15803d]');
          dom.micBtnIcon.textContent = '🎤';
          dom.micBtnLabel.textContent = '録音開始';
          return;
        }

        dom.micBtn.classList.remove('bg-[#16a34a]', 'hover:bg-[#15803d]');
        dom.micBtn.classList.add('bg-rose-600', 'hover:bg-rose-700', 'recording-pulse');
        dom.micBtnIcon.textContent = '⏹';

        if (state === 'recognizing') {
          dom.micBtnLabel.textContent = '録音停止（認識中...）';
        } else if (state === 'reconnecting') {
          dom.micBtnLabel.textContent = '録音停止（再接続中...）';
        } else {
          dom.micBtnLabel.textContent = '録音停止（聞き取り中...）';
        }
      }

      /**
       * 未確定のまま残っている仮テキストを救済確定する
       */
      function rescuePendingInterim() {
        if (utteranceCommitted) return false;
        const rescue = (bestInterimText || lastInterimText).trim();
        lastInterimText = '';
        bestInterimText = '';
        setInterimPreview('');
        if (!rescue) return false;

        utteranceCommitted = true;
        return commitUtterance(rescue, activeUtteranceMode);
      }

      /**
       * 仮テキスト更新が3.5秒停止したら強制確定して再接続するウォッチドッグ
       */
      function resetWatchdog() {
        if (watchdogTimer) {
          clearTimeout(watchdogTimer);
          watchdogTimer = null;
        }
        if (!shouldBeRecording || utteranceCommitted) return;

        watchdogTimer = setTimeout(() => {
          watchdogTimer = null;
          if (!shouldBeRecording || utteranceCommitted) return;
          if (!(bestInterimText || lastInterimText).trim()) return;

          rescuePendingInterim();
          if (recognition && isRecognitionActive) {
            try {
              recognition.stop();
              return;
            } catch (e) {}
          }
          isRecognitionActive = false;
          scheduleRestart(RESTART_COOLDOWN_MS);
        }, WATCHDOG_MS);
      }

      function createRecognitionInstance() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) return null;

        const rec = new SR();
        rec.continuous = false;
        rec.interimResults = true;

        rec.onstart = () => {
          isRecognitionActive = true;
          utteranceCommitted = false;
          lastInterimText = '';
          bestInterimText = '';
          activeUtteranceMode = dom.modeSelect ? dom.modeSelect.value : 'tw-practice';
          updateMicButtonUI('listening');
        };

        rec.onresult = (event) => {
          errorRetryCount = 0;

          let finalText = '';
          let interimText = '';

          for (let i = event.resultIndex; i < event.results.length; i++) {
            const transcript = event.results[i][0] ? event.results[i][0].transcript : '';
            if (event.results[i].isFinal) {
              finalText += transcript;
            } else {
              interimText += transcript;
            }
          }

          const trimmedFinal = finalText.trim();
          const trimmedInterim = interimText.trim();

          if (trimmedFinal) {
            if (watchdogTimer) {
              clearTimeout(watchdogTimer);
              watchdogTimer = null;
            }
            utteranceCommitted = true;
            lastInterimText = '';
            bestInterimText = '';
            setInterimPreview('');
            commitUtterance(trimmedFinal, activeUtteranceMode);
          } else if (trimmedInterim) {
            lastInterimText = trimmedInterim;
            if (trimmedInterim.length >= bestInterimText.length) {
              bestInterimText = trimmedInterim;
            }
            updateMicButtonUI('recognizing');
            setInterimPreview(trimmedInterim);
            resetWatchdog();
          } else if (bestInterimText && !utteranceCommitted) {
            // エンジンが突然仮テキストを消した場合も即座に救済確定する
            if (watchdogTimer) {
              clearTimeout(watchdogTimer);
              watchdogTimer = null;
            }
            rescuePendingInterim();
          }
        };

        rec.onerror = (event) => {
          const code = event ? event.error : '';

          if (code === 'not-allowed' || code === 'service-not-allowed') {
            stopRecording(false);
            showToast('マイクが拒否されています。ブラウザの設定からマイクを許可してください。');
            return;
          }

          if (!shouldBeRecording) return;

          errorRetryCount = Math.min(errorRetryCount + 1, 4);
          pendingBackoffMs = Math.min(ERROR_BACKOFF_MAX_MS, ERROR_BACKOFF_STEP_MS * errorRetryCount);
          updateMicButtonUI('reconnecting');

          // onend が来ない場合に備えた保険
          if (!isRecognitionActive) {
            const delay = pendingBackoffMs;
            pendingBackoffMs = 0;
            scheduleRestart(delay);
          }
        };

        rec.onend = () => {
          isRecognitionActive = false;
          if (watchdogTimer) {
            clearTimeout(watchdogTimer);
            watchdogTimer = null;
          }

          // isFinal を出さずに終了した場合も仮テキストを救済確定
          rescuePendingInterim();
          setInterimPreview('');

          if (shouldBeRecording) {
            const delay = pendingBackoffMs > 0 ? pendingBackoffMs : RESTART_COOLDOWN_MS;
            if (pendingBackoffMs > 0) updateMicButtonUI('reconnecting');
            pendingBackoffMs = 0;
            scheduleRestart(delay);
          } else {
            pendingBackoffMs = 0;
            updateMicButtonUI('idle');
          }
        };

        return rec;
      }

      function scheduleRestart(delayMs) {
        if (restartTimer) {
          clearTimeout(restartTimer);
          restartTimer = null;
        }
        if (!shouldBeRecording) return;

        const safeDelay = Math.max(RESTART_COOLDOWN_MS, Number(delayMs) || RESTART_COOLDOWN_MS);
        restartTimer = setTimeout(() => {
          restartTimer = null;
          if (!shouldBeRecording || isRecognitionActive) return;
          startRecognition();
        }, safeDelay);
      }

      function startRecognition() {
        if (!shouldBeRecording || isRecognitionActive) return;

        if (!recognition) {
          recognition = createRecognitionInstance();
        }
        if (!recognition) {
          stopRecording(false);
          showToast('このブラウザは音声認識に非対応です。Google Chromeをお使いください。');
          return;
        }

        utteranceCommitted = false;
        lastInterimText = '';
        bestInterimText = '';
        activeUtteranceMode = dom.modeSelect ? dom.modeSelect.value : 'tw-practice';

        const meta = MODES[activeUtteranceMode] || MODES['tw-practice'];
        recognition.lang = meta.lang;

        try {
          isRecognitionActive = true;
          recognition.start();
        } catch (err) {
          isRecognitionActive = false;
          errorRetryCount = Math.min(errorRetryCount + 1, 4);
          const backoff = Math.min(ERROR_BACKOFF_MAX_MS, ERROR_BACKOFF_STEP_MS * errorRetryCount);
          updateMicButtonUI('reconnecting');
          scheduleRestart(backoff);
        }
      }

      function startRecording() {
        // 録音開始前に入力欄のAPIキーを4重ストレージへ自動保存（マイク許可ダイアログ対策）
        if (dom.apiKeyInput) {
          const typed = normalizeKey(dom.apiKeyInput.value);
          if (typed) saveApiKey(typed);
          else if (apiKey) saveApiKey(apiKey);
        }

        if (!recognition) {
          recognition = createRecognitionInstance();
        }
        if (!recognition) {
          showToast('このブラウザは音声認識に非対応です。AndroidのGoogle Chrome等をお使いください。');
          return;
        }

        clearTimers();
        errorRetryCount = 0;
        pendingBackoffMs = 0;
        shouldBeRecording = true;
        updateMicButtonUI('listening');
        startRecognition();
      }

      function stopRecording(shouldRescue) {
        const rescue = shouldRescue !== false;
        shouldBeRecording = false;
        pendingBackoffMs = 0;
        errorRetryCount = 0;
        clearTimers();

        if (rescue) {
          rescuePendingInterim();
        } else {
          lastInterimText = '';
          bestInterimText = '';
          setInterimPreview('');
        }

        if (recognition && isRecognitionActive) {
          try {
            recognition.stop();
          } catch (e) {
            isRecognitionActive = false;
          }
        }
        updateMicButtonUI('idle');
      }

      // =========================================================
      // 10. クリップボードコピー（execCommand + Clipboard API フォールバック）
      // =========================================================

      function copyHistoryText(text) {
        let copied = false;
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '-9999px';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          copied = document.execCommand('copy');
          document.body.removeChild(ta);
        } catch (e) {
          copied = false;
        }

        if (copied) {
          showToast('会話履歴をすべてコピーしました');
          return;
        }

        if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
          navigator.clipboard.writeText(text)
            .then(() => showToast('会話履歴をすべてコピーしました'))
            .catch(() => showToast('コピーに失敗しました'));
        } else {
          showToast('コピーに失敗しました');
        }
      }

      // =========================================================
      // 11. イベントリスナー登録 & 初期化
      // =========================================================

      function bindEvents() {
        // 設定パネル開閉
        dom.settingsToggleBtn.addEventListener('click', () => {
          const isHidden = dom.apiSettingsDrawer.classList.toggle('hidden');
          dom.settingsToggleBtn.setAttribute('aria-expanded', String(!isHidden));
        });

        // APIキー表示・非表示トグル
        dom.toggleKeyEyeBtn.addEventListener('click', () => {
          const isPw = dom.apiKeyInput.type === 'password';
          dom.apiKeyInput.type = isPw ? 'text' : 'password';
          dom.toggleKeyEyeBtn.textContent = isPw ? '🙈 隠す' : '👁️ 表示';
        });

        // 保存ボタン
        dom.saveApiBtn.addEventListener('click', () => {
          const cleaned = normalizeKey(dom.apiKeyInput.value);
          if (!cleaned) {
            setInlineStatus('⚠️ APIキーを入力してください。', 'error');
            showToast('APIキーが空です');
            return;
          }
          saveApiKey(cleaned);
          setInlineStatus('✅ 保存しました（前後の空白は自動削除されました）。', 'success');
          showToast('APIキーを保存しました');
        });

        // リセットボタン
        dom.resetApiBtn.addEventListener('click', () => {
          saveApiKey('');
          saveStickyModel('');
          saveSelectedModel('auto');
          discoveredModels = [];
          renderModelOptions();
          setInlineStatus('🗑️ APIキーとモデル記憶をリセットしました。', 'default');
          showToast('設定をリセットしました');
        });

        // 接続テスト＆モデル取得ボタン
        dom.testApiBtn.addEventListener('click', async () => {
          const keyToTest = normalizeKey(dom.apiKeyInput.value) || apiKey;
          if (!keyToTest) {
            setInlineStatus('⚠️ テストするAPIキーを入力してください。', 'error');
            showToast('APIキーを入力してください');
            return;
          }

          saveApiKey(keyToTest);
          dom.testApiBtn.disabled = true;
          dom.testApiBtn.classList.add('opacity-60');
          setInlineStatus('🔄 モデル一覧を取得し、接続テスト中...', 'info');

          try {
            let discoveredCount = 0;
            try {
              const found = await discoverAvailableModels(keyToTest);
              discoveredCount = found.length;
            } catch (listErr) {
              if (isInvalidKeyError(listErr)) throw listErr;
            }

            const result = await callGeminiTranslate(
              'Translate "你好" into natural Japanese. Output ONLY the Japanese translation.',
              keyToTest,
              (msg) => setInlineStatus(`🔄 ${msg}`, 'info')
            );

            const countNote = discoveredCount > 0 ? ` / 検出モデル: ${discoveredCount}件` : '';
            setInlineStatus(
              `✅ 接続成功！（使用モデル: ${result.model}${countNote} / 応答: ${result.text}）`,
              'success'
            );
            showToast(`接続成功: ${result.model}`);
          } catch (err) {
            setInlineStatus(`❌ 接続エラー: ${err.message || '通信に失敗しました'}`, 'error');
            showToast('接続テストに失敗しました');
          } finally {
            dom.testApiBtn.disabled = false;
            dom.testApiBtn.classList.remove('opacity-60');
          }
        });

        // モデル手動選択
        dom.modelSelect.addEventListener('change', () => {
          saveSelectedModel(dom.modelSelect.value);
          const label = dom.modelSelect.value === 'auto' ? '自動（最速モデル優先）' : dom.modelSelect.value;
          showToast(`モデル設定: ${label}`);
        });

        // モード選択変更（録音中なら新言語で安全に再起動）
        dom.modeSelect.addEventListener('change', () => {
          applyModeLayout();
          const meta = MODES[dom.modeSelect.value];
          if (meta) showToast(`モード: ${meta.pill}`);

          if (shouldBeRecording) {
            clearTimers();
            pendingBackoffMs = 0;
            updateMicButtonUI('reconnecting');
            if (recognition && isRecognitionActive) {
              try {
                recognition.stop();
              } catch (e) {
                isRecognitionActive = false;
                scheduleRestart(RESTART_COOLDOWN_MS);
              }
            } else {
              scheduleRestart(RESTART_COOLDOWN_MS);
            }
          }
        });

        // 高密度モード：原文表示 ON/OFF
        dom.toggleOriginalBtn.addEventListener('click', () => {
          showOriginal = !showOriginal;
          storageSet(KEY_SHOW_ORIGINAL, showOriginal ? 'on' : 'off');
          updateCompactToolbarUI();
          syncScrollBottomBtn();
          showToast(showOriginal ? '原文表示: ON' : '原文表示: OFF（日本語訳のみ表示）');
        });

        // 高密度モード：文字サイズ 中/小
        dom.toggleFontSizeBtn.addEventListener('click', () => {
          compactSize = compactSize === 'sm' ? 'md' : 'sm';
          storageSet(KEY_COMPACT_SIZE, compactSize);
          updateCompactToolbarUI();
          syncScrollBottomBtn();
          showToast(compactSize === 'sm' ? '文字サイズ: 小（高密度）' : '文字サイズ: 中（標準）');
        });

        // スマート自動スクロール監視 & 「↓ 最新へ」ボタン
        dom.transcriptScroll.addEventListener('scroll', syncScrollBottomBtn, { passive: true });
        dom.scrollBottomBtn.addEventListener('click', () => {
          dom.transcriptScroll.scrollTo({
            top: dom.transcriptScroll.scrollHeight,
            behavior: 'smooth'
          });
        });

        // 録音開始 / 録音停止ボタン
        dom.micBtn.addEventListener('click', () => {
          if (shouldBeRecording) {
            stopRecording(true);
          } else {
            startRecording();
          }
        });

        // 全コピーボタン
        dom.copyBtn.addEventListener('click', () => {
          const cards = Array.from(dom.transcriptList.querySelectorAll('.utterance-card'));
          const blocks = cards.map((card) => {
            const time = card.dataset.time || '';
            const orig = card.querySelector('.orig-text')?.textContent.trim() || '';
            const origPy = card.querySelector('.orig-pinyin')?.textContent.trim() || '';
            const trans = card.querySelector('.trans-text')?.textContent.trim() || '';
            const transPy = card.querySelector('.trans-pinyin')?.textContent.trim() || '';

            const lines = [];
            if (time) lines.push(`[${time}]`);
            if (orig) lines.push(orig);
            if (origPy) lines.push(origPy);
            if (trans) lines.push(trans);
            if (transPy) lines.push(transPy);
            return lines.join('\n');
          }).filter(Boolean);

          if (blocks.length === 0) {
            showToast('コピーする会話履歴がありません');
            return;
          }
          copyHistoryText(blocks.join('\n\n'));
        });

        // クリアボタン
        dom.clearBtn.addEventListener('click', () => {
          const cards = dom.transcriptList.querySelectorAll('.utterance-card');
          if (cards.length === 0) {
            showToast('クリアする履歴がありません');
            return;
          }
          cards.forEach((card) => card.remove());
          setInterimPreview('');
          if (dom.emptyStateCard) dom.emptyStateCard.classList.remove('hidden');
          syncScrollBottomBtn();
          showToast('会話履歴をクリアしました');
        });
      }

      /**
       * アプリ初期化エントリーポイント
       */
      function init() {
        try {
          dom.settingsToggleBtn = document.getElementById('settings-toggle-btn');
          dom.apiStatusPill = document.getElementById('api-status-pill');
          dom.apiSettingsDrawer = document.getElementById('api-settings-drawer');
          dom.apiKeyInput = document.getElementById('api-key-input');
          dom.toggleKeyEyeBtn = document.getElementById('toggle-key-eye-btn');
          dom.modelSelect = document.getElementById('model-select');
          dom.stickyModelHint = document.getElementById('sticky-model-hint');
          dom.saveApiBtn = document.getElementById('save-api-btn');
          dom.resetApiBtn = document.getElementById('reset-api-btn');
          dom.testApiBtn = document.getElementById('test-api-btn');
          dom.apiInlineStatus = document.getElementById('api-inline-status');
          dom.modeSelect = document.getElementById('mode-select');
          dom.compactOptionsBar = document.getElementById('compact-options-bar');
          dom.toggleOriginalBtn = document.getElementById('toggle-original-btn');
          dom.toggleFontSizeBtn = document.getElementById('toggle-fontsize-btn');
          dom.transcriptScroll = document.getElementById('transcript-scroll');
          dom.transcriptList = document.getElementById('transcript-list');
          dom.emptyStateCard = document.getElementById('empty-state-card');
          dom.emptyStateTitle = document.getElementById('empty-state-title');
          dom.emptyStateDesc = document.getElementById('empty-state-desc');
          dom.interimPreview = document.getElementById('interim-preview');
          dom.interimPreviewText = document.getElementById('interim-preview-text');
          dom.scrollBottomBtn = document.getElementById('scroll-bottom-btn');
          dom.micBtn = document.getElementById('mic-btn');
          dom.micBtnIcon = document.getElementById('mic-btn-icon');
          dom.micBtnLabel = document.getElementById('mic-btn-label');
          dom.copyBtn = document.getElementById('copy-btn');
          dom.clearBtn = document.getElementById('clear-btn');
          dom.toast = document.getElementById('toast');

          loadSettings();
          applyModeLayout();
          recognition = createRecognitionInstance();
          bindEvents();
        } catch (err) {
          showToast('初期化エラー: ' + (err && err.message ? err.message : '不明なエラー'));
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
