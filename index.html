<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>台湾華語トランスクライバー Pro</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- pinyin-pro (非同期読込・安全ヘルパー関数経由でのみ参照) -->
  <script src="https://unpkg.com/pinyin-pro" async></script>
  <style>
    /* ベースレイアウト（モバイル 100dvh 対応） */
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background-color: #f3f5f9;
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .app-shell {
      height: 100vh;
      height: 100dvh;
    }

    /* 録音中パルスアニメーション */
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.5); }
      70% { box-shadow: 0 0 0 10px rgba(225, 29, 72, 0); }
      100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
    }
    .recording-pulse {
      animation: pulse-ring 1.5s infinite;
    }

    /* 翻訳中スピナー */
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .spinner {
      display: inline-block;
      width: 13px;
      height: 13px;
      border: 2px solid rgba(37, 99, 235, 0.25);
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }

    /* モバイル下部セーフエリア余白 */
    .safe-bottom {
      padding-bottom: max(0.5rem, env(safe-area-inset-bottom));
    }

    /* =========================================================
       高密度フラット字幕モード (mode === 'tw-translate')
       ========================================================= */
    #transcript-scroll.compact-mode {
      background-color: #ffffff;
      padding: 0;
    }
    #transcript-scroll.compact-mode #transcript-list {
      gap: 0;
      padding-bottom: 1.75rem;
    }
    #transcript-scroll.compact-mode .utterance-card {
      background-color: #ffffff;
      border: none;
      border-bottom: 1px solid #e5e7eb;
      border-radius: 0;
      box-shadow: none;
      padding: 5px 10px;
      margin: 0;
    }
    #transcript-scroll.compact-mode .utterance-card::after {
      content: '';
      display: table;
      clear: both;
    }
    #transcript-scroll.compact-mode .mode-pill {
      display: none !important;
    }
    #transcript-scroll.compact-mode .card-header {
      float: right;
      margin: 0 0 0 8px;
      padding: 0;
      line-height: 1.32;
    }
    #transcript-scroll.compact-mode .card-time {
      font-size: 10px;
      color: #9ca3af;
      font-weight: 400;
    }
    #transcript-scroll.compact-mode .orig-text {
      font-size: 11px;
      line-height: 1.28;
      font-weight: 400;
      color: #6b7280;
      margin-bottom: 1px;
    }
    #transcript-scroll.compact-mode.hide-original .orig-text {
      display: none !important;
    }
    #transcript-scroll.compact-mode .output-area {
      margin-top: 0;
      padding-top: 0;
      border-top: none;
    }
    #transcript-scroll.compact-mode .trans-text {
      font-size: 14px;
      line-height: 1.32;
      font-weight: 600;
      color: #0f172a;
    }
    #transcript-scroll.compact-mode .model-badge-row {
      display: none !important;
    }
    #transcript-scroll.compact-mode .translating-row {
      font-size: 12px;
      line-height: 1.32;
      color: #6b7280;
      font-style: italic;
      gap: 5px;
    }
    #transcript-scroll.compact-mode .spinner {
      width: 11px;
      height: 11px;
      border-width: 1.5px;
    }
    #transcript-scroll.compact-mode .error-box {
      background-color: #fff1f2;
      border: 1px solid #fecdd3;
      border-radius: 6px;
      padding: 3px 7px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-wrap: wrap;
    }
    #transcript-scroll.compact-mode .error-msg {
      font-size: 11.5px;
      line-height: 1.3;
    }
    #transcript-scroll.compact-mode .card-retry-btn {
      padding: 2px 8px;
      font-size: 11px;
      border-radius: 5px;
    }
    /* 高密度モード：文字サイズ「小」 */
    #transcript-scroll.compact-mode.compact-size-sm .orig-text {
      font-size: 10px;
      line-height: 1.24;
    }
    #transcript-scroll.compact-mode.compact-size-sm .trans-text {
      font-size: 12.5px;
      line-height: 1.32;
    }
    /* 高密度モード：仮テキストプレビュー */
    #transcript-scroll.compact-mode #interim-preview {
      border-radius: 0;
      border-left: none;
      border-right: none;
      border-top: none;
      border-bottom: 1px dashed #cbd5e1;
      box-shadow: none;
      padding: 5px 10px;
      margin: 0;
      background-color: #f8fafc;
    }
    #transcript-scroll.compact-mode #interim-preview-text {
      font-size: 12.5px;
      line-height: 1.32;
    }
  </style>
</head>
<body class="text-slate-800 overflow-hidden select-none">

  <!-- アプリ全体コンテナ -->
  <div class="app-shell flex flex-col w-full bg-[#f3f5f9]">

    <!-- ヘッダーバー・設定パネル・モード選択 -->
    <header class="bg-white border-b border-slate-200/90 px-3 pt-2.5 pb-2 shadow-sm shrink-0 z-20">
      <div class="max-w-2xl mx-auto space-y-2">

        <!-- タイトル & 設定ボタン行 -->
        <div class="flex items-center justify-between gap-2">
          <div class="flex items-center gap-1.5 min-w-0">
            <span class="text-lg shrink-0" aria-hidden="true">🇹🇼</span>
            <h1 class="text-sm sm:text-base font-bold text-slate-900 truncate">
              台湾華語トランスクライバー Pro
            </h1>
          </div>

          <button
            type="button"
            id="settings-toggle-btn"
            aria-expanded="false"
            aria-controls="api-settings-drawer"
            class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-xl border border-slate-300 bg-slate-50 hover:bg-slate-100 active:bg-slate-200 text-xs font-semibold text-slate-700 transition shrink-0 cursor-pointer"
          >
            <span>⚙️ 設定</span>
            <span
              id="api-status-pill"
              class="px-1.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800"
            >
              未設定
            </span>
          </button>
        </div>

        <!-- 折りたたみ式 API設定パネル -->
        <section
          id="api-settings-drawer"
          class="hidden bg-slate-50 border border-slate-200 rounded-2xl p-3 space-y-2.5 max-h-[60vh] overflow-y-auto"
          aria-label="API設定"
        >
          <!-- 端末自動判定ステータス -->
          <div class="flex items-center justify-between gap-2 bg-white border border-slate-200 rounded-xl px-2.5 py-1.5">
            <span class="text-[11px] font-bold text-slate-600">動作環境プロファイル</span>
            <span
              id="settings-env-badge"
              class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-blue-100 text-blue-800"
            >
              Android/PC最適化
            </span>
          </div>

          <!-- Gemini APIキー入力 -->
          <div class="space-y-1">
            <div class="flex items-center justify-between">
              <label for="api-key-input" class="text-xs font-bold text-slate-700">
                Gemini APIキー（翻訳モードで必要）
              </label>
              <button
                type="button"
                id="toggle-key-eye-btn"
                class="text-xs font-semibold text-blue-600 hover:text-blue-800 px-1.5 py-0.5 rounded-lg hover:bg-blue-50 transition cursor-pointer"
              >
                👁️ 表示
              </button>
            </div>
            <input
              type="password"
              id="api-key-input"
              placeholder="AIzaSy... を貼り付け"
              autocomplete="off"
              autocapitalize="off"
              spellcheck="false"
              class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 select-text"
            >
          </div>

          <!-- モデル選択ドロップダウン -->
          <div class="space-y-1">
            <div class="flex items-center justify-between gap-2">
              <label for="model-select" class="text-xs font-bold text-slate-700">
                翻訳AIモデル
              </label>
              <span id="sticky-model-hint" class="text-[11px] font-medium text-slate-500 truncate">
                最速優先（3.5-flash-lite優先）
              </span>
            </div>
            <div class="relative">
              <select
                id="model-select"
                class="w-full appearance-none bg-white border border-slate-300 text-slate-800 font-semibold text-xs sm:text-sm rounded-xl px-3 py-2 pr-8 focus:outline-none focus:ring-2 focus:ring-blue-500 transition cursor-pointer"
              >
                <option value="auto">自動（高速・最優先）</option>
              </select>
              <span class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-slate-500 text-xs">
                ▼
              </span>
            </div>
          </div>

          <!-- 保存・リセットボタン行 -->
          <div class="grid grid-cols-2 gap-2">
            <button
              type="button"
              id="save-api-btn"
              class="py-2 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white text-xs sm:text-sm font-bold shadow-sm transition cursor-pointer"
            >
              💾 保存
            </button>
            <button
              type="button"
              id="reset-api-btn"
              class="py-2 px-3 rounded-xl bg-rose-600 hover:bg-rose-700 active:scale-[0.98] text-white text-xs sm:text-sm font-bold shadow-sm transition cursor-pointer"
            >
              🗑️ リセット
            </button>
          </div>

          <!-- 接続テスト＆モデル取得ボタン -->
          <button
            type="button"
            id="test-api-btn"
            class="w-full py-2 px-3 rounded-xl bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white text-xs sm:text-sm font-bold shadow-sm transition cursor-pointer"
          >
            🔌 接続テスト＆モデル取得
          </button>

          <!-- インラインフィードバック -->
          <div
            id="api-inline-status"
            class="text-xs font-medium text-slate-600 leading-relaxed break-words min-h-[1rem]"
          ></div>
        </section>

        <!-- 4モード選択ドロップダウン -->
        <div class="relative">
          <select
            id="mode-select"
            aria-label="文字起こし・翻訳モード選択"
            class="w-full appearance-none bg-blue-50/90 border border-blue-200 text-blue-950 font-bold text-xs sm:text-sm rounded-xl px-3 py-2 pr-8 focus:outline-none focus:ring-2 focus:ring-blue-500 transition cursor-pointer"
          >
            <option value="tw-practice">🇹🇼 台湾華語（発音練習・ピンイン付）</option>
            <option value="tw-translate">🇹🇼→🇯🇵 台湾華語（日本語へ翻訳・高密度）</option>
            <option value="jp-to-tw">🇯🇵→🇹🇼 日本語（台湾華語へ翻訳＋ピンイン）</option>
            <option value="en-translate">🇺🇸→🇯🇵 英語（日本語へ翻訳）</option>
          </select>
          <span class="pointer-events-none absolute inset-y-0 right-3 flex items-center text-blue-700 text-xs">
            ▼
          </span>
        </div>

        <!-- 高密度モード専用ツールバー (tw-translate 選択時のみ表示) -->
        <div
          id="compact-options-bar"
          class="hidden flex items-center justify-between gap-2 px-2.5 py-1.5 rounded-xl bg-slate-100 border border-slate-200/80 text-xs"
        >
          <span class="font-bold text-slate-600 truncate">📺 字幕モード表示</span>
          <div class="flex items-center gap-1.5 shrink-0">
            <button
              type="button"
              id="toggle-original-btn"
              class="px-2.5 py-1 rounded-lg font-bold border transition cursor-pointer bg-blue-600 text-white border-blue-600"
            >
              原文表示: ON
            </button>
            <button
              type="button"
              id="toggle-fontsize-btn"
              class="px-2.5 py-1 rounded-lg font-bold border transition cursor-pointer bg-white text-slate-700 border-slate-300 hover:bg-slate-50"
            >
              文字: 中
            </button>
          </div>
        </div>

      </div>
    </header>

    <!-- 会話タイムライン領域 -->
    <div class="relative flex-1 min-h-0 flex flex-col">
      <main id="transcript-scroll" class="flex-1 overflow-y-auto px-3 py-2.5">
        <div id="transcript-list" class="max-w-2xl mx-auto flex flex-col gap-2.5 pb-4">
          <!-- モード別 初期画面（エンプティステート）ガイドカード -->
          <div
            id="empty-state-card"
            class="bg-white border border-dashed border-slate-300 rounded-2xl p-5 text-center text-slate-500 mt-3 mx-3 shadow-sm"
          >
            <div id="empty-state-icon" class="text-3xl mb-2" aria-hidden="true">🗣️</div>
            <p id="empty-state-title" class="text-sm font-bold text-slate-800 mb-1.5">
              台湾華語（発音練習・ピンイン付）モード
            </p>
            <p id="empty-state-desc" class="text-xs leading-relaxed text-slate-500">
              下の『🎤 録音開始』を押して台湾華語を話すと、繁体字と声調記号付きピンインが表示されます。発音ボタンで音声も確認できます（APIキー不要）。
            </p>
          </div>

          <!-- リアルタイム仮テキストプレビュー -->
          <div
            id="interim-preview"
            class="hidden bg-white/95 border border-dashed border-blue-300 rounded-2xl px-3.5 py-2.5 shadow-sm"
          >
            <div class="flex items-center gap-1.5 text-[11px] font-bold text-blue-600 mb-0.5">
              <span class="inline-block w-1.5 h-1.5 rounded-full bg-rose-500 animate-pulse"></span>
              <span>聞き取り中...</span>
            </div>
            <div id="interim-preview-text" class="text-base font-medium text-slate-500 italic break-words"></div>
          </div>
        </div>
      </main>

      <!-- 上へスクロール中に表示される「↓ 最新へ」ボタン -->
      <button
        type="button"
        id="scroll-bottom-btn"
        class="hidden absolute bottom-3 right-3 z-30 px-3 py-1.5 rounded-full bg-slate-900/85 hover:bg-slate-900 text-white text-xs font-bold shadow-lg backdrop-blur-sm transition active:scale-95 cursor-pointer"
      >
        ↓ 最新へ
      </button>
    </div>

    <!-- 下部固定コントロールバー -->
    <footer class="bg-white border-t border-slate-200/90 px-3 pt-2 safe-bottom shrink-0 z-20 shadow-[0_-3px_10px_rgba(15,23,42,0.05)]">
      <div class="max-w-2xl mx-auto space-y-2">
        <!-- ライブマイク稼働ステータス & 動作環境バッジ -->
        <div class="flex items-center justify-between gap-2 px-1 text-[11px] font-semibold">
          <div id="mic-live-status" class="flex items-center gap-1.5 text-slate-500 truncate">
            <span id="mic-live-dot" class="inline-block w-2 h-2 rounded-full bg-slate-300 shrink-0"></span>
            <span id="mic-live-text" class="truncate">待機中</span>
          </div>
          <span
            id="env-mode-badge"
            class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 text-[10px] font-bold shrink-0"
          >
            Android/PC最適化
          </span>
        </div>

        <!-- プライマリ録音開始/停止ボタン -->
        <button
          type="button"
          id="mic-btn"
          class="w-full py-3 px-4 rounded-xl bg-[#16a34a] hover:bg-[#15803d] active:scale-[0.99] text-white font-bold text-sm sm:text-base shadow-sm flex items-center justify-center gap-2 transition cursor-pointer"
        >
          <span id="mic-btn-icon" aria-hidden="true">🎤</span>
          <span id="mic-btn-label">録音開始</span>
        </button>

        <!-- セカンダリボタン行（全コピー・クリア） -->
        <div class="grid grid-cols-2 gap-2">
          <button
            type="button"
            id="copy-btn"
            class="py-2.5 px-3 rounded-xl bg-blue-600 hover:bg-blue-700 active:scale-[0.98] text-white font-bold text-xs sm:text-sm shadow-sm flex items-center justify-center gap-1.5 transition cursor-pointer"
          >
            <span aria-hidden="true">📋</span>
            <span>全コピー</span>
          </button>
          <button
            type="button"
            id="clear-btn"
            class="py-2.5 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 active:scale-[0.98] text-slate-700 border border-slate-300 font-bold text-xs sm:text-sm shadow-sm flex items-center justify-center gap-1.5 transition cursor-pointer"
          >
            <span aria-hidden="true">🗑️</span>
            <span>クリア</span>
          </button>
        </div>
      </div>
    </footer>

  </div>

  <!-- フローティングトースト通知（pointer-events-none でタップ妨害なし / alert・confirm 不使用） -->
  <div
    id="toast"
    role="status"
    aria-live="polite"
    style="pointer-events: none;"
    class="fixed bottom-28 left-1/2 -translate-x-1/2 translate-y-2 opacity-0 pointer-events-none bg-slate-900/95 text-white text-xs sm:text-sm font-semibold px-4 py-2 rounded-full shadow-lg transition-all duration-200 z-50 max-w-[92vw] text-center"
  ></div>

  <script>
    /**
     * 台湾華語トランスクライバー Pro - メインアプリケーションスクリプト
     * すべての外部API・ストレージ・外部ライブラリ参照を個別 try/catch で保護し、
     * Android Chrome / iPhone Safari 両方で安定動作する単一ファイル実装。
     */
    (function () {
      'use strict';

      // =========================================================
      // 1. 環境判定・定数・モード定義
      // =========================================================
      const isIOS = (function () {
        try {
          const ua = navigator.userAgent || '';
          const platform = navigator.platform || '';
          const touchPoints = Number(navigator.maxTouchPoints || 0);
          return /iPad|iPhone|iPod/.test(ua) || (platform === 'MacIntel' && touchPoints > 1);
        } catch (e) {
          return false;
        }
      })();

      const WINDOW_NAME_PREFIX = 'TW_TRANSCRIBER_PRO::';
      const STORAGE_PREFIX = 'tw_transcriber_pro_v7_';
      const KEY_API = STORAGE_PREFIX + 'api_key';
      const KEY_STICKY_MODEL = STORAGE_PREFIX + 'sticky_model';
      const KEY_MODEL_OVERRIDE = STORAGE_PREFIX + 'model_override';
      const KEY_SHOW_ORIGINAL = STORAGE_PREFIX + 'show_original';
      const KEY_COMPACT_SIZE = STORAGE_PREFIX + 'compact_size';

      const FETCH_TIMEOUT_MS = 6000;
      const AUTO_SCROLL_THRESHOLD_PX = 80;
      const START_TIMEOUT_MS = 3000;
      const WATCHDOG_MS = 3500;
      const RESTART_COOLDOWN_MS = 280;
      const DEDUP_WINDOW_MS = 1500;
      const ERROR_BACKOFF_STEP_MS = 500;
      const ERROR_BACKOFF_MAX_MS = 2000;

      const TTS_RATE_NORMAL = 0.95;
      const TTS_RATE_SLOW = 0.65;

      const PRESET_MODELS = [
        'gemini-3.5-flash-lite',
        'gemini-3.5-flash',
        'gemini-2.5-flash-lite',
        'gemini-2.5-flash',
        'gemini-3.8-flash'
      ];

      const EXCLUDED_MODEL_REGEX = /(embedding|imagen|veo|aqa|tts|audio|whisper|vision|robotics|computer-use|learnlm)/i;

      const MODES = {
        'tw-practice': {
          lang: 'zh-TW',
          icon: '🗣️',
          pill: '台湾華語 発音',
          pillClass: 'bg-emerald-100 text-emerald-800',
          title: '台湾華語（発音練習・ピンイン付）モード',
          desc: '下の『🎤 録音開始』を押して台湾華語を話すと、繁体字と声調記号付きピンインが表示されます。発音ボタンで音声も確認できます（APIキー不要）。'
        },
        'tw-translate': {
          lang: 'zh-TW',
          icon: '📺',
          pill: '台湾華語→日本語',
          pillClass: 'bg-blue-100 text-blue-800',
          title: '台湾華語（日本語へ翻訳・高密度）モード',
          desc: '下の『🎤 録音開始』を押して台湾華語を聞き取ると、日本語訳を字幕のように高密度で一覧表示します。上のバーで原文ON/OFFや文字サイズも切り替えられます（要APIキー）。'
        },
        'jp-to-tw': {
          lang: 'ja-JP',
          icon: '💬',
          pill: '日本語→台湾華語',
          pillClass: 'bg-indigo-100 text-indigo-800',
          title: '日本語（台湾華語へ翻訳＋ピンイン）モード',
          desc: '下の『🎤 録音開始』を押して日本語を話すと、自然な台湾華語（繁体字）と声調記号付きピンインに翻訳します。発音ボタンで相手に音声を聞かせることもできます（要APIキー）。'
        },
        'en-translate': {
          lang: 'en-US',
          icon: '🌐',
          pill: '英語→日本語',
          pillClass: 'bg-violet-100 text-violet-800',
          title: '英語（日本語へ翻訳）モード',

      // =========================================================
      // 2. アプリケーション状態変数
      // =========================================================

      let discoveredModels = [];

      // =========================================================
      // 3. 安全ヘルパー関数

      /**
       * pinyin-pro を安全に呼び出す（未読込・遅延・失敗時は空文字を返す）
       */
      function toPinyin(text) {
        try {
          if (window.pinyinPro && typeof window.pinyinPro.pinyin === 'function') {
            return window.pinyinPro.pinyin(String(text || ''), { toneType: 'symbol' }) || '';
          }
        } catch (e) {}
        return '';
      }

      /**
       * APIキーの前後・途中の余分な空白や改行を除去する
       */
      function normalizeKey(raw) {
        return String(raw || '').trim().replace(/\s+/g, '');
      }

      /**
       * 現在時刻を HH:MM:SS 形式で返す
       */
      function formatTime() {
        const now = new Date();
        const pad = (n) => String(n).padStart(2, '0');
        return pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds());
      }

      /**
       * トースト通知を表示（alert / confirm の代替）
       */
      function showToast(message) {
        if (!dom.toast) return;

        toastTimer = setTimeout(() => {
          if (!dom.toast) return;
          dom.toast.classList.remove('opacity-100', 'translate-y-0');
          dom.toast.classList.add('opacity-0', 'translate-y-2');
        }, 2600);
      }

      /**
       * APIキー不正エラーかどうかを判定する
       */
      function isInvalidKeyError(err) {
        const msg = String(err && err.message ? err.message : err || '');
        return /API_KEY_INVALID|API key not valid|invalid api key|PERMISSION_DENIED/i.test(msg);
      }

      // =========================================================
      // 4. 4重ストレージ保存・復元（個別 try/catch 保護）
      // =========================================================

      function readWindowNameMap() {
        try {
          if (typeof window.name === 'string' && window.name.indexOf(WINDOW_NAME_PREFIX) === 0) {
            const parsed = JSON.parse(window.name.slice(WINDOW_NAME_PREFIX.length));
            if (parsed && typeof parsed === 'object') return parsed;
          }
        } catch (e) {}
        return {};
      }

      function storageSet(key, value) {
        const strVal = String(value || '');

        // 1) localStorage
        try {
          if (strVal) window.localStorage.setItem(key, strVal);
          else window.localStorage.removeItem(key);
        } catch (e) {}

        // 2) sessionStorage
        try {
          if (strVal) window.sessionStorage.setItem(key, strVal);
          else window.sessionStorage.removeItem(key);
        } catch (e) {}

        // 3) window.name
        try {
          const map = readWindowNameMap();
          if (strVal) map[key] = strVal;
          else delete map[key];
          window.name = WINDOW_NAME_PREFIX + JSON.stringify(map);
        } catch (e) {}

        // 4) document.cookie
        try {
          if (strVal) {
            document.cookie = key + '=' + encodeURIComponent(strVal) + '; path=/; max-age=2592000; SameSite=Lax';
          } else {
            document.cookie = key + '=; path=/; max-age=0; SameSite=Lax';
          }
        } catch (e) {}
      }

      function storageGet(key) {
        let value = '';

        // 1) localStorage
        if (!value) {
          try {
            const v = window.localStorage.getItem(key);
            if (v) value = String(v);
          } catch (e) {}
        }

        // 2) sessionStorage
        if (!value) {
          try {
            const v = window.sessionStorage.getItem(key);
            if (v) value = String(v);
          } catch (e) {}
        }

        // 3) window.name
        if (!value) {
          try {
            const map = readWindowNameMap();
            if (typeof map[key] === 'string' && map[key]) {
              value = map[key];
            }
          } catch (e) {}
        }

        // 4) document.cookie
        if (!value) {
          try {
            const parts = String(document.cookie || '').split(';');
            for (let i = 0; i < parts.length; i++) {
              const pair = parts[i].trim();
              if (pair.indexOf(key + '=') === 0) {
                value = decodeURIComponent(pair.slice(key.length + 1));
                break;
              }
            }
          } catch (e) {}
        }

        if (value) storageSet(key, value);
        return value;
      }

      function loadSettings() {
        // 旧バージョンで保存されたAPIキーも自動引き継ぎ
        apiKey = normalizeKey(
          storageGet(KEY_API) ||
          storageGet('tw_transcriber_pro_v6_api_key') ||
          storageGet('tw_transcriber_pro_v5_api_key') ||
          storageGet('tw_transcriber_pro_v4_api_key') ||
          storageGet('tw_transcriber_pro_v3_api_key') ||
          storageGet('gemini_api_key_tw') ||
          storageGet('geminiApiKey')
        );

        stickyModel = (
          storageGet(KEY_STICKY_MODEL) ||
          storageGet('tw_transcriber_pro_v6_sticky_model') ||

        ).trim();

        showOriginal = savedOrig !== 'off';

      function saveApiKey(rawKey) {
        apiKey = normalizeKey(rawKey);
        storageSet(KEY_API, apiKey);
        if (dom.apiKeyInput) dom.apiKeyInput.value = apiKey;

      }

      function saveStickyModel(modelName) {

        storageSet(KEY_STICKY_MODEL, stickyModel);
        updateStickyHint();
      }

      function saveSelectedModel(val) {
        selectedModel = String(val || 'auto').trim() || 'auto';
        storageSet(KEY_MODEL_OVERRIDE, selectedModel === 'auto' ? '' : selectedModel);
        updateStickyHint();
      }

      function updateApiStatusBadge() {
        if (!dom.apiStatusPill) return;
        if (apiKey) {
          dom.apiStatusPill.textContent = '設定済み';
          dom.apiStatusPill.className = 'px-1.5 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800';
        } else {
          dom.apiStatusPill.textContent = '未設定';
          dom.apiStatusPill.className = 'px-1.5 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800';
        }
      }

      function updateStickyHint() {
        if (!dom.stickyModelHint) return;
        if (selectedModel !== 'auto') {
          dom.stickyModelHint.textContent = '手動固定: ' + selectedModel;
        } else if (stickyModel) {
          dom.stickyModelHint.textContent = '記憶優先: ⚡ ' + stickyModel;
        } else {
          dom.stickyModelHint.textContent = '最速優先（3.5-flash-lite優先）';
        }
      }

      function setInlineStatus(text, tone) {
        if (!dom.apiInlineStatus) return;
        dom.apiInlineStatus.textContent = text || '';
        const base = 'text-xs leading-relaxed break-words min-h-[1rem] ';

        } else if (tone === 'error') {

        } else if (tone === 'info') {

        } else {

      function renderModelOptions() {
        if (!dom.modelSelect) return;
        const list = [];
        PRESET_MODELS.forEach((m) => { if (list.indexOf(m) === -1) list.push(m); });
        discoveredModels.forEach((m) => { if (list.indexOf(m) === -1) list.push(m); });
        if (selectedModel !== 'auto' && list.indexOf(selectedModel) === -1) {
          list.push(selectedModel);
        }

        dom.modelSelect.innerHTML = '';
        const autoOpt = document.createElement('option');
        autoOpt.value = 'auto';
        autoOpt.textContent = '自動（高速・最優先）';
        dom.modelSelect.appendChild(autoOpt);

        list.forEach((modelName) => {
          const opt = document.createElement('option');
          opt.value = modelName;
          opt.textContent = modelName;
          dom.modelSelect.appendChild(opt);
        });

        dom.modelSelect.value = list.indexOf(selectedModel) !== -1 ? selectedModel : 'auto';
      }

      // =========================================================
      // 5. 台湾華語（zh-TW）音声再生エンジン（iOS / Android 両対応）
      // =========================================================

      function clearTtsTimers() {
        if (ttsSafetyTimer) {
          clearTimeout(ttsSafetyTimer);
          ttsSafetyTimer = null;
        }
        if (ttsPollTimer) {
          clearInterval(ttsPollTimer);
          ttsPollTimer = null;
        }
      }

      function refreshTtsVoices() {
        try {
          if ('speechSynthesis' in window && typeof window.speechSynthesis.getVoices === 'function') {
            const list = window.speechSynthesis.getVoices();
            if (Array.isArray(list) && list.length > 0) {
              availableVoices = list;
            }
          }
        } catch (e) {}
      }

      /**
       * 台湾華語（zh-TW）ボイスを最優先選択する（見つからなければ null を返し lang='zh-TW' に委ねる）
       */
      function getPreferredTwVoice() {
        if (!availableVoices.length) refreshTtsVoices();
        if (!availableVoices.length) return null;

        const exactTw = availableVoices.find((v) => /^zh[-_]TW$/i.test(v.lang || ''));
        if (exactTw) return exactTw;

        const namedTw = availableVoices.find((v) => /taiwan|mei-jia|meijia|美佳|國語|臺灣|台灣/i.test((v.name || '') + ' ' + (v.lang || '')));
        if (namedTw) return namedTw;

        const hant = availableVoices.find((v) => /zh[-_]hant/i.test(v.lang || ''));
        if (hant) return hant;

        const anyZh = availableVoices.find((v) => /^zh/i.test(v.lang || ''));
        return anyZh || null;
      }

      function setTtsButtonVisual(btn, playing) {
        if (!btn) return;
        if (playing) {
          btn.textContent = '⏹ 停止';
          btn.className = 'inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-bold border border-rose-500 bg-rose-500 text-white shadow-sm active:scale-95 transition cursor-pointer';
        } else {
          btn.textContent = btn.dataset.idleLabel || '🔊 発音';
          btn.className = 'inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-xs font-bold border border-teal-200 bg-teal-50 hover:bg-teal-100 text-teal-800 active:scale-95 transition cursor-pointer';
        }
      }

      function finishTtsSession(resumeIfPaused) {
        clearTtsTimers();
        if (activeTtsBtn) {
          setTtsButtonVisual(activeTtsBtn, false);
          activeTtsBtn = null;
        }

        if (resumeIfPaused && pausedForTTS) {
          pausedForTTS = false;
          if (!isIOS && wantRecording) {
            updateMicButtonUI('reconnecting');
            scheduleRestart(RESTART_COOLDOWN_MS);
          } else {
            wantRecording = false;
            updateMicButtonUI('idle');
          }
        }
      }

      function stopTTS(resumeIfPaused) {
        ttsSessionId++;
        try {
          if ('speechSynthesis' in window && (window.speechSynthesis.speaking || window.speechSynthesis.pending)) {
            window.speechSynthesis.cancel();
          }
        } catch (e) {}
        finishTtsSession(resumeIfPaused !== false);
      }

      /**
       * クリックイベント内で同期的に台湾華語を再生する（iOS制限・cancel無音バグ・録音競合対策済み）
       */
      function speakTaiwanese(text, rate, btn) {
        const cleanText = String(text || '').trim();
        if (!cleanText) return;

        let synth = null;
        try {
          if ('speechSynthesis' in window && typeof window.SpeechSynthesisUtterance === 'function') {
            synth = window.speechSynthesis;
          }
        } catch (e) {
          synth = null;
        }

        if (!synth) {
          showToast('このブラウザは音声再生に対応していません');
          return;
        }

        // 再生中の同じボタンをタップした場合は停止
        if (activeTtsBtn === btn) {
          stopTTS(true);
          return;
        }

        const wasPausedForTts = pausedForTTS;
        ttsSessionId++;
        clearTtsTimers();
        if (activeTtsBtn) {
          setTtsButtonVisual(activeTtsBtn, false);
          activeTtsBtn = null;
        }

        // iOSのcancel無音バグ防止のため、speaking または pending の場合のみ cancel() を呼ぶ
        try {
          if (synth.speaking || synth.pending) {
            synth.cancel();
          }
        } catch (e) {}

        // 録音中のオーディオ競合対策
        if (wantRecording || isRecognizing || isStarting) {
          if (isIOS) {
            // iOSでは確実に録音を完全停止してから再生（再生後の自動再開なし）
            stopRecording(false);
            showToast('発音再生のため録音を停止しました');
          } else if (!wasPausedForTts) {
            // Android/PCでは再生中のみ一時停止し、終了後に280ms待って自動再開
            pausedForTTS = true;
            clearRecognitionTimers();
            pendingBackoffMs = 0;
            lastInterimText = '';
            bestInterimText = '';
            setInterimPreview('');
            updateMicButtonUI('tts');

            if (recognition && (isRecognizing || isStarting)) {
              try {
                recognition.abort();
              } catch (e) {
                try { recognition.stop(); } catch (e2) {}
                isRecognizing = false;
                isStarting = false;
              }
            }
          }
        }

        const currentSession = ++ttsSessionId;
        activeTtsBtn = btn;
        setTtsButtonVisual(btn, true);
        ttsStartedAt = Date.now();

        try {
          const utterance = new SpeechSynthesisUtterance(cleanText);
          utterance.lang = 'zh-TW';
          utterance.rate = rate;
          utterance.pitch = 1.0;

          const voice = getPreferredTwVoice();
          if (voice) utterance.voice = voice;

          utterance.onend = () => {
            if (currentSession !== ttsSessionId) return;
            finishTtsSession(true);
          };

          utterance.onerror = (ev) => {
            if (currentSession !== ttsSessionId) return;
            const errType = ev && ev.error ? ev.error : '';
            if (errType && errType !== 'canceled' && errType !== 'interrupted') {
              showToast('音声再生エラー（端末の消音スイッチや音量を確認してください）');
            }
            finishTtsSession(true);
          };

          // onend 未発火対策：最大安全タイマーとポーリング監視
          const maxDurationMs = Math.max(4500, Math.min(35000, Math.ceil((cleanText.length * 480) / rate) + 3500));
          ttsSafetyTimer = setTimeout(() => {
            if (currentSession !== ttsSessionId) return;
            try {
              if (synth.speaking || synth.pending) synth.cancel();
            } catch (e) {}
            finishTtsSession(true);
          }, maxDurationMs);

          ttsPollTimer = setInterval(() => {
            if (currentSession !== ttsSessionId) {
              clearTtsTimers();
              return;
            }
            if (Date.now() - ttsStartedAt < 1400) return;
            try {
              if (!synth.speaking && !synth.pending) {
                finishTtsSession(true);
              }
            } catch (e) {}
          }, 450);

          // クリックイベント内で同期的に speak() を実行
          synth.speak(utterance);
        } catch (err) {
          showToast('音声再生を開始できませんでした');
          finishTtsSession(true);
        }
      }

      /**
       * ピンイン表示カード用の音声再生ボタン行を生成
       */
      function createTtsControlsRow(chineseText) {
        const row = document.createElement('div');
        row.className = 'tts-controls flex items-center flex-wrap gap-1.5 mt-2';

        const normalBtn = document.createElement('button');
        normalBtn.type = 'button';
        normalBtn.dataset.idleLabel = '🔊 発音';
        setTtsButtonVisual(normalBtn, false);
        normalBtn.addEventListener('click', () => {
          speakTaiwanese(chineseText, TTS_RATE_NORMAL, normalBtn);
        });

        const slowBtn = document.createElement('button');
        slowBtn.type = 'button';
        slowBtn.dataset.idleLabel = '🐢 ゆっくり';
        setTtsButtonVisual(slowBtn, false);
        slowBtn.addEventListener('click', () => {
          speakTaiwanese(chineseText, TTS_RATE_SLOW, slowBtn);
        });

        row.appendChild(normalBtn);
        row.appendChild(slowBtn);
        return row;
      }

      // =========================================================
      // 6. 高速翻訳エンジン（Gemini REST API v1beta）
      // =========================================================

      /**
       * タイムアウト付き fetch JSON ヘルパー（6秒タイムアウト）
       */
      async function fetchJsonWithTimeout(url, options, timeoutMs) {
        const controller = typeof AbortController === 'function' ? new AbortController() : null;
        let timerId = null;
        const opts = Object.assign({}, options || {});

        if (controller) {
          opts.signal = controller.signal;
          timerId = setTimeout(() => {
            try { controller.abort(); } catch (e) {}
          }, timeoutMs || FETCH_TIMEOUT_MS);
        }

        try {
          const response = await fetch(url, opts);
          let data = null;
          try {
            data = await response.json();
          } catch (e) {
            data = null;
          }
          if (!response.ok) {
            const detail = data && data.error && data.error.message
              ? data.error.message
              : ('HTTP ' + response.status + ' ' + (response.statusText || ''));
            const err = new Error(detail);
            err.status = response.status;
            throw err;
          }
          return data;
        } catch (err) {
          if (err && err.name === 'AbortError') {
            throw new Error('タイムアウト（' + Math.round((timeoutMs || FETCH_TIMEOUT_MS) / 1000) + '秒）');
          }
          throw err;
        } finally {
          if (timerId) clearTimeout(timerId);
        }
      }

      /**
       * ListModels から取得したモデル名を優先度スコアで並べる
       */
      function scoreModelName(name) {
        const lower = String(name || '').toLowerCase();
        let score = 0;
        if (lower === 'gemini-3.5-flash-lite') score += 500;
        else if (lower === 'gemini-3.5-flash') score += 450;
        else if (lower === 'gemini-2.5-flash-lite') score += 400;
        else if (lower === 'gemini-2.5-flash') score += 350;
        else if (lower === 'gemini-3.8-flash') score += 300;
        else if (lower.indexOf('flash-lite') !== -1) score += 260;
        else if (lower.indexOf('flash') !== -1) score += 220;
        else if (lower.indexOf('pro') !== -1) score += 120;

        if (lower.indexOf('latest') !== -1) score -= 5;
        if (lower.indexOf('exp') !== -1 || lower.indexOf('preview') !== -1) score -= 10;
        return score;
      }

      /**
       * ListModels API で利用可能なテキスト生成モデル一覧を取得する
       */
      async function discoverAvailableModels(key) {
        const url = 'https://generativelanguage.googleapis.com/v1beta/models?key=' + encodeURIComponent(key);
        const data = await fetchJsonWithTimeout(url, { method: 'GET' }, FETCH_TIMEOUT_MS);
        const models = Array.isArray(data && data.models) ? data.models : [];

        const valid = [];
        for (let i = 0; i < models.length; i++) {
          const item = models[i];
          const methods = Array.isArray(item.supportedGenerationMethods) ? item.supportedGenerationMethods : [];
          if (methods.indexOf('generateContent') === -1) continue;

          const shortName = String(item.name || '').replace(/^models\//, '').trim();
          if (!shortName || shortName.indexOf('gemini') === -1) continue;
          if (EXCLUDED_MODEL_REGEX.test(shortName)) continue;
          if (valid.indexOf(shortName) === -1) valid.push(shortName);
        }

        valid.sort((a, b) => scoreModelName(b) - scoreModelName(a));
        discoveredModels = valid;
        renderModelOptions();
        return valid;
      }

      /**
       * 翻訳試行順のモデルリストを構築（手動固定 or スティッキー優先 + プリセット順）
       */
      function buildCandidateModelList() {
        if (selectedModel && selectedModel !== 'auto') {
          return [selectedModel];
        }

        const list = [];
        if (stickyModel) list.push(stickyModel);
        PRESET_MODELS.forEach((m) => { if (list.indexOf(m) === -1) list.push(m); });
        discoveredModels.forEach((m) => { if (list.indexOf(m) === -1) list.push(m); });
        return list;
      }

      /**
       * モード別の翻訳プロンプトを生成
       */
      function buildTranslationPrompt(text, mode) {
        if (mode === 'tw-translate') {
          return '以下の台湾華語（繁体字）を自然な日本語に翻訳してください。翻訳結果の日本語のみを出力し、説明や補足は一切書かないでください。\n\n' + text;
        }
        if (mode === 'jp-to-tw') {
          return '以下の日本語を台湾で使われる自然な台湾華語（繁体字）に翻訳してください。繁体字の翻訳結果のみを出力し、ピンインや説明は一切書かないでください。\n\n' + text;
        }
        if (mode === 'en-translate') {
          return '以下の英語を自然な日本語に翻訳してください。翻訳結果の日本語のみを出力し、説明や補足は一切書かないでください。\n\n' + text;
        }
        return text;
      }

      /**
       * 単一モデルに対して Gemini generateContent を実行する
       */
      async function requestGeminiSingleModel(modelName, prompt, key) {
        const url = 'https://generativelanguage.googleapis.com/v1beta/models/' +
          encodeURIComponent(modelName) + ':generateContent?key=' + encodeURIComponent(key);

        const data = await fetchJsonWithTimeout(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { temperature: 0.2 }
          })
        }, FETCH_TIMEOUT_MS);

        const candidates = data && Array.isArray(data.candidates) ? data.candidates : [];
        const parts = candidates[0] && candidates[0].content && Array.isArray(candidates[0].content.parts)
          ? candidates[0].content.parts
          : [];
        const out = parts.map((p) => (p && typeof p.text === 'string' ? p.text : '')).join('').trim();

        if (!out) {
          throw new Error('翻訳結果が空でした');
        }
        return out;
      }

      /**
       * スティッキー優先・即時フォールバック・全失敗時 ListModels 自動探索付き翻訳実行
       */
      async function callGeminiTranslate(prompt, key, onProgress) {
        const candidates = buildCandidateModelList();
        const tried = [];
        let lastError = null;

        // 第1段階：優先リストを待機なしで順次フォールバック
        for (let i = 0; i < candidates.length; i++) {
          const modelName = candidates[i];
          tried.push(modelName);
          if (typeof onProgress === 'function') {
            onProgress('翻訳中 (' + (i + 1) + '/' + candidates.length + ': ' + modelName + ')');
          }
          try {
            const text = await requestGeminiSingleModel(modelName, prompt, key);
            if (selectedModel === 'auto') {
              saveStickyModel(modelName);
            }
            return { text: text, model: modelName };
          } catch (err) {
            lastError = new Error('[' + modelName + '] ' + (err && err.message ? err.message : '通信エラー'));
            if (isInvalidKeyError(err)) {
              throw lastError;
            }
          }
        }

        // 第2段階：自動モードで全候補失敗時のみ ListModels で未試行モデルを自動探索して試行
        if (selectedModel === 'auto') {
          try {
            if (typeof onProgress === 'function') {
              onProgress('利用可能な代替モデルを検索中...');
            }
            const found = await discoverAvailableModels(key);
            const extras = found.filter((m) => tried.indexOf(m) === -1);

            for (let j = 0; j < extras.length; j++) {
              const altModel = extras[j];
              if (typeof onProgress === 'function') {
                onProgress('代替モデル試行中 (' + altModel + ')');
              }
              try {
                const text = await requestGeminiSingleModel(altModel, prompt, key);
                saveStickyModel(altModel);
                return { text: text, model: altModel };
              } catch (altErr) {
                lastError = new Error('[' + altModel + '] ' + (altErr && altErr.message ? altErr.message : '通信エラー'));
                if (isInvalidKeyError(altErr)) {
                  throw lastError;
                }
              }
            }
          } catch (listErr) {
            if (isInvalidKeyError(listErr)) {
              throw listErr;
            }
          }
        }

        throw lastError || new Error('翻訳に失敗しました');
      }

      // =========================================================
      // 7. モード別エンプティステート・高密度レイアウト・スマートスクロール
      // =========================================================

      function isNearBottom() {
        if (!dom.transcriptScroll) return true;
        const gap = dom.transcriptScroll.scrollHeight - dom.transcriptScroll.scrollTop - dom.transcriptScroll.clientHeight;
        return gap <= AUTO_SCROLL_THRESHOLD_PX;
      }

      function syncScrollBottomBtn() {
        if (!dom.scrollBottomBtn || !dom.transcriptScroll) return;
        const hasCards = dom.transcriptList && dom.transcriptList.querySelector('.utterance-card');
        if (hasCards && !isNearBottom()) {
          dom.scrollBottomBtn.classList.remove('hidden');
        } else {
          dom.scrollBottomBtn.classList.add('hidden');
        }
      }

      function scrollToBottomIfAuto(wasNearBottom) {
        if (!dom.transcriptScroll) return;
        if (wasNearBottom) {
          dom.transcriptScroll.scrollTop = dom.transcriptScroll.scrollHeight;
        }
        syncScrollBottomBtn();
      }

      /**
       * 選択中のモードに合わせて初期画面（エンプティステート）のアイコン・タイトル・説明文を更新
       */
      function updateEmptyStateContent() {
        const modeKey = dom.modeSelect ? dom.modeSelect.value : 'tw-practice';
        const meta = MODES[modeKey] || MODES['tw-practice'];
        if (dom.emptyStateIcon) dom.emptyStateIcon.textContent = meta.icon;
        if (dom.emptyStateTitle) dom.emptyStateTitle.textContent = meta.title;
        if (dom.emptyStateDesc) dom.emptyStateDesc.textContent = meta.desc;
      }

      /**
       * 高密度字幕モード用ツールバー（原文ON/OFF・文字 中/小）の表示とクラスを同期
       */
      function updateCompactToolbarUI() {
        if (dom.transcriptScroll) {
          dom.transcriptScroll.classList.toggle('hide-original', !showOriginal);
          dom.transcriptScroll.classList.toggle('compact-size-sm', compactSize === 'sm');

        if (dom.toggleOriginalBtn) {

          if (showOriginal) {

          } else {
            dom.toggleOriginalBtn.className = 'px-2.5 py-1 rounded-lg font-bold border transition cursor-pointer bg-white text-slate-700 border-slate-300 hover:bg-slate-50';
          }
        }

          dom.toggleFontSizeBtn.textContent = compactSize === 'sm' ? '文字: 小' : '文字: 中';
          if (compactSize === 'sm') {

          } else {

      /**
       * 現在のモードに応じて高密度レイアウト・専用バー・エンプティステートを適用
       */
      function applyModeLayout() {
        const modeKey = dom.modeSelect ? dom.modeSelect.value : 'tw-practice';
        const isCompact = modeKey === 'tw-translate';

        if (dom.transcriptScroll) {
          dom.transcriptScroll.classList.toggle('compact-mode', isCompact);
        }
        if (dom.compactOptionsBar) {
          dom.compactOptionsBar.classList.toggle('hidden', !isCompact);
        }

        updateEmptyStateContent();
        updateCompactToolbarUI();
        syncScrollBottomBtn();

      /**
       * 聞き取り中の仮テキストプレビューを更新
       */
      function setInterimPreview(text) {
        if (!dom.interimPreview || !dom.interimPreviewText) return;
        const trimmed = String(text || '').trim();
        const wasNear = isNearBottom();

        if (!trimmed) {
          dom.interimPreview.classList.add('hidden');
          dom.interimPreviewText.textContent = '';
          return;
        }

        if (dom.emptyStateCard) dom.emptyStateCard.classList.add('hidden');
        dom.interimPreviewText.textContent = trimmed;
        dom.interimPreview.classList.remove('hidden');
        scrollToBottomIfAuto(wasNear);
      }

      // =========================================================
      // 8. 会話カード生成・翻訳結果レンダリング
      // =========================================================

      function renderTranslationLoading(outputArea, statusMsg) {
        outputArea.innerHTML = '';
        const row = document.createElement('div');
        row.className = 'translating-row flex items-center gap-2 text-xs sm:text-sm text-blue-600 font-medium';

        const spinner = document.createElement('span');
        spinner.className = 'spinner';
        spinner.setAttribute('aria-hidden', 'true');

        const label = document.createElement('span');
        label.className = 'translating-label truncate';
        label.textContent = statusMsg || '翻訳中...';

        row.appendChild(spinner);
        row.appendChild(label);
        outputArea.appendChild(row);
      }

      function renderTranslationError(outputArea, errorMessage, onRetry) {
        outputArea.innerHTML = '';
        const box = document.createElement('div');
        box.className = 'error-box bg-rose-50 border border-rose-200 rounded-xl p-2.5 space-y-2';

        const msgEl = document.createElement('div');
        msgEl.className = 'error-msg text-xs font-semibold text-rose-700 leading-relaxed break-words select-text';
        msgEl.textContent = '⚠️ 翻訳エラー: ' + errorMessage;

        const retryBtn = document.createElement('button');
        retryBtn.type = 'button';
        retryBtn.className = 'card-retry-btn inline-flex items-center gap-1 px-2.5 py-1 rounded-lg bg-white hover:bg-rose-100 border border-rose-300 text-rose-700 text-xs font-bold shadow-xs active:scale-95 transition cursor-pointer';
        retryBtn.textContent = '🔄 再試行';
        retryBtn.addEventListener('click', onRetry);

        box.appendChild(msgEl);
        box.appendChild(retryBtn);
        outputArea.appendChild(box);
      }

      function renderTranslationSuccess(outputArea, translatedText, modelName, mode) {
        outputArea.innerHTML = '';

        const transEl = document.createElement('div');
        transEl.className = 'trans-text text-base sm:text-lg font-bold text-blue-700 leading-snug break-words select-text';
        transEl.textContent = translatedText;
        outputArea.appendChild(transEl);

        // 日本語→台湾華語モードでは翻訳後の繁体字に対するピンインと発音ボタンを追加
        if (mode === 'jp-to-tw') {
          const py = toPinyin(translatedText);
          if (py) {
            const pyEl = document.createElement('div');
            pyEl.className = 'trans-pinyin text-xs sm:text-sm font-mono text-slate-500 mt-1 break-words select-text';
            pyEl.textContent = py;
            outputArea.appendChild(pyEl);
          }
          outputArea.appendChild(createTtsControlsRow(translatedText));
        }

        // 通常モードのカード右下に小さく使用モデル名を表示（高密度モードではCSSで自動非表示）
        if (modelName) {
          const badgeRow = document.createElement('div');
          badgeRow.className = 'model-badge-row flex justify-end mt-1.5';

          const badge = document.createElement('span');
          badge.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 text-[10px] font-semibold';
          badge.textContent = '⚡ ' + modelName;

          badgeRow.appendChild(badge);
          outputArea.appendChild(badgeRow);
        }
      }

      async function runCardTranslation(text, mode, outputArea) {
        const keyNow = normalizeKey(dom.apiKeyInput ? dom.apiKeyInput.value : '') || apiKey;
        if (!keyNow) {
          renderTranslationError(
            outputArea,
            'APIキーが未設定です。右上の「⚙️ 設定」からGemini APIキーを保存してください。',
            () => runCardTranslation(text, mode, outputArea)
          );
          return;
        }
        if (keyNow !== apiKey) saveApiKey(keyNow);

        const wasNear = isNearBottom();
        renderTranslationLoading(outputArea, '翻訳中...');
        scrollToBottomIfAuto(wasNear);

        try {
          const prompt = buildTranslationPrompt(text, mode);
          const result = await callGeminiTranslate(prompt, keyNow, (progressText) => {
            const lbl = outputArea.querySelector('.translating-label');
            if (lbl) lbl.textContent = progressText;
          });
          const nearAfter = isNearBottom();
          renderTranslationSuccess(outputArea, result.text, result.model, mode);
          scrollToBottomIfAuto(nearAfter);
        } catch (err) {
          const nearAfter = isNearBottom();
          const msg = err && err.message ? err.message : '翻訳リクエストに失敗しました';
          renderTranslationError(outputArea, msg, () => runCardTranslation(text, mode, outputArea));
          scrollToBottomIfAuto(nearAfter);
        }
      }

      /**
       * 確定テキスト（または救済テキスト）をタイムラインへ追加する（1.5秒以内の同一文二重確定を防止）
       */
      function commitUtterance(text, mode) {
        const cleanText = String(text || '').trim();
        if (!cleanText || !dom.transcriptList) return false;

        const now = Date.now();
        if (cleanText === lastCommittedText && (now - lastCommittedAt) < DEDUP_WINDOW_MS) {
          return false;
        }
        lastCommittedText = cleanText;
        lastCommittedAt = now;

        const wasNear = isNearBottom();
        if (dom.emptyStateCard) dom.emptyStateCard.classList.add('hidden');

        const meta = MODES[mode] || MODES['tw-practice'];
        const timeStr = formatTime();

        const card = document.createElement('article');
        card.className = 'utterance-card bg-white border border-slate-200/90 rounded-2xl p-3.5 shadow-sm';
        card.dataset.mode = mode;
        card.dataset.time = timeStr;

        // カードヘッダー（モードバッジ・時刻）
        const header = document.createElement('div');
        header.className = 'card-header flex items-center justify-between gap-2 mb-1.5';

        const pill = document.createElement('span');
        pill.className = 'mode-pill px-2 py-0.5 rounded-full text-[10px] font-bold ' + meta.pillClass;
        pill.textContent = meta.pill;

        const timeEl = document.createElement('span');
        timeEl.className = 'card-time text-[11px] font-medium text-slate-400 tabular-nums';
        timeEl.textContent = timeStr;

        header.appendChild(pill);
        header.appendChild(timeEl);
        card.appendChild(header);

        // 原文テキスト
        const origEl = document.createElement('div');
        origEl.className = 'orig-text text-lg sm:text-xl font-bold text-slate-900 leading-snug break-words select-text';
        origEl.textContent = cleanText;
        card.appendChild(origEl);

        if (mode === 'tw-practice') {
          // 発音練習モード：声調記号付きピンイン + 発音ボタン（API不要）
          const py = toPinyin(cleanText);
          if (py) {
            const pyEl = document.createElement('div');
            pyEl.className = 'orig-pinyin text-sm font-mono text-slate-500 mt-1 break-words select-text';
            pyEl.textContent = py;
            card.appendChild(pyEl);
          }
          card.appendChild(createTtsControlsRow(cleanText));
        } else {
          // 翻訳モード：出力領域を作成して非同期翻訳を開始
          const outputArea = document.createElement('div');
          outputArea.className = 'output-area mt-2 pt-2 border-t border-slate-100';
          card.appendChild(outputArea);
          runCardTranslation(cleanText, mode, outputArea);
        }

        // 仮テキストプレビューの直前に挿入
        if (dom.interimPreview && dom.interimPreview.parentNode === dom.transcriptList) {
          dom.transcriptList.insertBefore(card, dom.interimPreview);
        } else {
          dom.transcriptList.appendChild(card);
        }

        scrollToBottomIfAuto(wasNear);
        return true;
      }

      // =========================================================
      // 9. iOS / Android Chrome 両対応・安定化音声認識エンジン
      // =========================================================

      function clearStartTimeout() {
        if (startTimeoutTimer) {
          clearTimeout(startTimeoutTimer);
          startTimeoutTimer = null;
        }
      }

      function clearRecognitionTimers() {
        clearStartTimeout();
        if (restartTimer) {
          clearTimeout(restartTimer);
          restartTimer = null;
        }
        if (watchdogTimer) {
          clearTimeout(watchdogTimer);
          watchdogTimer = null;
        }
      }

      /**
       * 録音ボタンおよびライブステータスバーの表示更新
       * state: 'idle' | 'connecting' | 'active' | 'speaking' | 'reconnecting' | 'tts'
       */
      function updateMicButtonUI(state) {
        if (!dom.micBtn || !dom.micBtnIcon || !dom.micBtnLabel) return;

        if (state === 'idle') {
          dom.micBtn.classList.remove('bg-rose-600', 'hover:bg-rose-700', 'recording-pulse');
          dom.micBtn.classList.add('bg-[#16a34a]', 'hover:bg-[#15803d]');

          dom.micBtnLabel.textContent = '録音開始';

          }
          if (dom.micLiveText) {

            dom.micLiveText.className = 'truncate text-slate-500';
