        }

        dom.micBtn.classList.remove('bg-[#16a34a]', 'hover:bg-[#15803d]');
        dom.micBtn.classList.add('bg-rose-600', 'hover:bg-rose-700', 'recording-pulse');
        dom.micBtnIcon.textContent = '⏹';

        if (state === 'connecting') {
          dom.micBtnLabel.textContent = '録音停止（⏳ 接続中...）';
          if (dom.micLiveDot) dom.micLiveDot.className = 'inline-block w-2 h-2 rounded-full bg-amber-500 animate-pulse shrink-0';
          if (dom.micLiveText) {
            dom.micLiveText.textContent = '⏳ 接続中...';
            dom.micLiveText.className = 'truncate text-amber-700';
          }
        } else if (state === 'speaking') {
          dom.micBtnLabel.textContent = '録音停止（🗣️ 音声を検出中...）';
          if (dom.micLiveDot) dom.micLiveDot.className = 'inline-block w-2 h-2 rounded-full bg-rose-500 animate-ping shrink-0';
          if (dom.micLiveText) {
            dom.micLiveText.textContent = '🗣️ 音声を検出中...';
            dom.micLiveText.className = 'truncate text-rose-600';
          }
        } else if (state === 'reconnecting') {
          dom.micBtnLabel.textContent = '録音停止（🔄 再接続中...）';
          if (dom.micLiveDot) dom.micLiveDot.className = 'inline-block w-2 h-2 rounded-full bg-amber-500 animate-pulse shrink-0';
          if (dom.micLiveText) {
            dom.micLiveText.textContent = '🔄 再接続中...';
            dom.micLiveText.className = 'truncate text-amber-700';
          }
        } else if (state === 'tts') {
          dom.micBtnLabel.textContent = '録音停止（🔊 発音再生中...）';
          if (dom.micLiveDot) dom.micLiveDot.className = 'inline-block w-2 h-2 rounded-full bg-teal-500 animate-pulse shrink-0';
          if (dom.micLiveText) {
            dom.micLiveText.textContent = '🔊 発音再生中...';
            dom.micLiveText.className = 'truncate text-teal-700';
          }
        } else {
          dom.micBtnLabel.textContent = '録音停止（🎙️ マイク稼働中）';
          if (dom.micLiveDot) dom.micLiveDot.className = 'inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse shrink-0';
          if (dom.micLiveText) {
            dom.micLiveText.textContent = '🎙️ マイク稼働中';
            dom.micLiveText.className = 'truncate text-emerald-700';
          }
        }
      }

      /**
       * 未確定のまま残っている仮テキストを救済して確定する
       */
      function rescuePendingInterim() {
        if (utteranceCommitted) return false;
        const rescue = (bestInterimText || lastInterimText).trim();
        lastInterimText = '';
        bestInterimText = '';
        setInterimPreview('');
        if (!rescue) return false;

        utteranceCommitted = true;
        lastRescuedSnapshot = rescue;
        return commitUtterance(rescue, activeUtteranceMode);
      }

      /**
       * 仮テキスト更新が3.5秒停止したら自動確定するウォッチドッグ（Android/PC向け）
       */
      function resetWatchdog() {
        if (watchdogTimer) {
          clearTimeout(watchdogTimer);
          watchdogTimer = null;
        }
        if (!wantRecording || pausedForTTS || utteranceCommitted) return;

        watchdogTimer = setTimeout(() => {
          watchdogTimer = null;
          if (!wantRecording || pausedForTTS || utteranceCommitted) return;
          if (!(bestInterimText || lastInterimText).trim()) return;

          rescuePendingInterim();
          if (isIOS) {
            if (isRecognizing) updateMicButtonUI('active');
            return;
          }
          if (recognition && isRecognizing) {
            try {
              recognition.stop();
              return;
            } catch (e) {}
          }
          isRecognizing = false;
          scheduleRestart(RESTART_COOLDOWN_MS);
        }, WATCHDOG_MS);
      }

      /**
       * SpeechRecognition インスタンスを安全に生成する
       */
      function createRecognitionInstance() {
        try {
          const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
          if (!SR) return null;

          const rec = new SR();
          rec.continuous = isIOS;
          rec.interimResults = true;

          rec.onstart = () => {
            clearStartTimeout();
            isStarting = false;
            isRecognizing = true;
            utteranceCommitted = false;
            lastInterimText = '';
            bestInterimText = '';
            lastRescuedSnapshot = '';
            activeUtteranceMode = dom.modeSelect ? dom.modeSelect.value : 'tw-practice';
            if (!pausedForTTS && wantRecording) {
              updateMicButtonUI('active');
            }
          };

          rec.onaudiostart = () => {
            if (!pausedForTTS && wantRecording && isRecognizing) {
              updateMicButtonUI('active');
            }
          };

          rec.onspeechstart = () => {
            if (!pausedForTTS && wantRecording && isRecognizing) {
              updateMicButtonUI('speaking');
            }
          };

          rec.onspeechend = () => {
            if (!pausedForTTS && wantRecording && isRecognizing) {
              updateMicButtonUI('active');
            }
          };

          rec.onresult = (event) => {
            if (pausedForTTS || !wantRecording) return;
            errorRetryCount = 0;

            let finalText = '';
            let interimText = '';

            for (let i = event.resultIndex; i < event.results.length; i++) {
              const transcript = event.results[i][0] ? event.results[i][0].transcript : '';
              if (event.results[i].isFinal) {
                finalText += transcript;
              } else {
                interimText += transcript;
              }
            }

            const trimmedFinal = finalText.trim();
            const trimmedInterim = interimText.trim();

            if (trimmedFinal) {
              if (watchdogTimer) {
                clearTimeout(watchdogTimer);
                watchdogTimer = null;
              }
              const alreadyRescued = lastRescuedSnapshot && trimmedFinal === lastRescuedSnapshot;
              lastRescuedSnapshot = '';
              lastInterimText = '';
              bestInterimText = '';
              setInterimPreview('');
              utteranceCommitted = !isIOS;
              if (!alreadyRescued) {
                commitUtterance(trimmedFinal, activeUtteranceMode);
              }
              if (isRecognizing) updateMicButtonUI('active');
            } else if (trimmedInterim) {
              if (lastRescuedSnapshot && trimmedInterim === lastRescuedSnapshot) {
                return;
              }
              lastRescuedSnapshot = '';
              utteranceCommitted = false;
              lastInterimText = trimmedInterim;
              if (trimmedInterim.length >= bestInterimText.length) {
                bestInterimText = trimmedInterim;
              }
              updateMicButtonUI('speaking');
              setInterimPreview(trimmedInterim);
              resetWatchdog();
            } else if (bestInterimText && !utteranceCommitted) {
              if (watchdogTimer) {
                clearTimeout(watchdogTimer);
                watchdogTimer = null;
              }
              rescuePendingInterim();
            }
          };

          rec.onerror = (event) => {
            clearStartTimeout();
            const code = event ? event.error : '';

            if (code === 'not-allowed' || code === 'service-not-allowed') {
              stopRecording(false);
              showToast('マイクが拒否されています。ブラウザの設定からマイクを許可してください。');
              return;
            }

            if (!wantRecording || pausedForTTS) return;

            if (isIOS) {
              // iOSではゾンビ状態防止のため確実に停止表示へ戻す
              if (code === 'no-speech' || code === 'aborted' || code === 'audio-capture' || code === 'network') {
                rescuePendingInterim();
                wantRecording = false;
                isStarting = false;
                isRecognizing = false;
                clearRecognitionTimers();
                updateMicButtonUI('idle');
                showToast('マイクが停止しました。もう一度タップしてください');
              }
              return;
            }

            // Android/PC：マイク拒否以外のエラーは500ms〜2000msバックオフで自動復帰
            errorRetryCount = Math.min(errorRetryCount + 1, 4);
            pendingBackoffMs = Math.min(ERROR_BACKOFF_MAX_MS, ERROR_BACKOFF_STEP_MS * errorRetryCount);
            updateMicButtonUI('reconnecting');

            if (!isRecognizing && !isStarting) {
              const delay = pendingBackoffMs;
              pendingBackoffMs = 0;
              scheduleRestart(delay);
            }
          };

          rec.onend = () => {
            clearStartTimeout();
            isStarting = false;
            isRecognizing = false;
            if (watchdogTimer) {
              clearTimeout(watchdogTimer);
              watchdogTimer = null;
            }

            if (pausedForTTS) {
              lastInterimText = '';
              bestInterimText = '';
              setInterimPreview('');
              if (wantRecording) updateMicButtonUI('tts');
              return;
            }

            rescuePendingInterim();
            setInterimPreview('');

            if (modeSwitchInProgress) {
              modeSwitchInProgress = false;
              if (wantRecording) {
                if (isIOS) {
                  wantRecording = false;
                  updateMicButtonUI('idle');
                  showToast('モードを切り替えました。もう一度「録音開始」をタップしてください');
                } else {
                  scheduleRestart(RESTART_COOLDOWN_MS);
                }
              } else {
                updateMicButtonUI('idle');
              }
              return;
            }

            if (manualStopInProgress) {
              manualStopInProgress = false;
              pendingBackoffMs = 0;
              updateMicButtonUI('idle');
              return;
            }

            if (wantRecording) {
              if (isIOS) {
                // iOSではonend時に自動再開せず確実に停止状態へ戻す
                wantRecording = false;
                pendingBackoffMs = 0;
                updateMicButtonUI('idle');
                showToast('マイクが停止しました。もう一度タップしてください');
                return;
              }
              const delay = pendingBackoffMs > 0 ? pendingBackoffMs : RESTART_COOLDOWN_MS;
              if (pendingBackoffMs > 0) updateMicButtonUI('reconnecting');
              pendingBackoffMs = 0;
              scheduleRestart(delay);
            } else {
              pendingBackoffMs = 0;
              updateMicButtonUI('idle');
            }
          };

          return rec;
        } catch (e) {
          return null;
        }
      }

      function scheduleRestart(delayMs) {
        if (restartTimer) {
          clearTimeout(restartTimer);
          restartTimer = null;
        }
        if (isIOS || !wantRecording || pausedForTTS) return;

        const safeDelay = Math.max(RESTART_COOLDOWN_MS, Number(delayMs) || RESTART_COOLDOWN_MS);
        restartTimer = setTimeout(() => {
          restartTimer = null;
          if (!wantRecording || pausedForTTS || isRecognizing || isStarting) return;
          startRecognition();
        }, safeDelay);
      }

      function startRecognition() {
        if (!wantRecording || pausedForTTS || isRecognizing || isStarting) return;

        if (!recognition) {
          recognition = createRecognitionInstance();
        }
        if (!recognition) {
          stopRecording(false);
          showToast('このブラウザは音声認識に非対応です。SafariまたはChromeをお使いください。');
          return;
        }

        utteranceCommitted = false;
        lastInterimText = '';
        bestInterimText = '';
        lastRescuedSnapshot = '';
        activeUtteranceMode = dom.modeSelect ? dom.modeSelect.value : 'tw-practice';

        const meta = MODES[activeUtteranceMode] || MODES['tw-practice'];
        recognition.lang = meta.lang;
        recognition.continuous = isIOS;

        clearStartTimeout();
        isStarting = true;
        updateMicButtonUI('connecting');

        // 3秒以内にonstartが返らない場合は起動詰まりとして安全に停止状態へリセット
        startTimeoutTimer = setTimeout(() => {
          startTimeoutTimer = null;
          if (!isStarting || isRecognizing) return;

          isStarting = false;
          wantRecording = false;
          manualStopInProgress = true;
          clearRecognitionTimers();
          try {
            recognition.abort();
          } catch (e) {
            try { recognition.stop(); } catch (e2) {}
          }
          manualStopInProgress = false;
          updateMicButtonUI('idle');
          showToast('マイクの起動がタイムアウトしました。もう一度タップしてください');
        }, START_TIMEOUT_MS);

        try {
          recognition.start();
        } catch (err) {
          clearStartTimeout();
          isStarting = false;
          isRecognizing = false;
          if (isIOS) {
            wantRecording = false;
            updateMicButtonUI('idle');
            showToast('マイクを開始できませんでした。もう一度タップしてください');
            return;
          }
          errorRetryCount = Math.min(errorRetryCount + 1, 4);
          const backoff = Math.min(ERROR_BACKOFF_MAX_MS, ERROR_BACKOFF_STEP_MS * errorRetryCount);
          updateMicButtonUI('reconnecting');
          scheduleRestart(backoff);
        }
      }

      function startRecording() {
        // 録音開始前に入力欄のAPIキーを4重ストレージへ自動保存（権限許可後の消失対策）
        if (dom.apiKeyInput) {
          const typed = normalizeKey(dom.apiKeyInput.value);
          if (typed) saveApiKey(typed);
          else if (apiKey) saveApiKey(apiKey);
        }

        // 再生中のTTSがあれば停止してから録音開始
        if (activeTtsBtn) {
          stopTTS(false);
        }

        if (!recognition) {
          recognition = createRecognitionInstance();
        }
        if (!recognition) {
          showToast('このブラウザは音声認識に非対応です。SafariまたはChromeをお使いください。');
          return;
        }

        clearRecognitionTimers();
        errorRetryCount = 0;
        pendingBackoffMs = 0;
        pausedForTTS = false;
        manualStopInProgress = false;
        modeSwitchInProgress = false;
        wantRecording = true;
        startRecognition();
      }

      function stopRecording(shouldRescue) {
        const rescue = shouldRescue !== false;
        wantRecording = false;
        pausedForTTS = false;
        modeSwitchInProgress = false;
        manualStopInProgress = true;
        pendingBackoffMs = 0;
        errorRetryCount = 0;
        clearRecognitionTimers();

        if (rescue) {
          rescuePendingInterim();
        } else {
          lastInterimText = '';
          bestInterimText = '';
          setInterimPreview('');
        }

        if (recognition && (isRecognizing || isStarting)) {
          try {
            recognition.stop();
          } catch (e) {
            isRecognizing = false;
            isStarting = false;
            manualStopInProgress = false;
          }
        } else {
          isRecognizing = false;
          isStarting = false;
          manualStopInProgress = false;
        }
        updateMicButtonUI('idle');
      }

      // =========================================================
      // 10. クリップボードコピー（execCommand 優先 + Clipboard API フォールバック）
      // =========================================================

      function copyHistoryText(text) {
        let copied = false;
        try {
          const ta = document.createElement('textarea');
          ta.value = text;
          ta.setAttribute('readonly', '');
          ta.style.position = 'fixed';
          ta.style.top = '-9999px';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.focus();
          ta.select();
          ta.setSelectionRange(0, ta.value.length);
          copied = document.execCommand('copy');
          document.body.removeChild(ta);
        } catch (e) {
          copied = false;
        }

        if (copied) {
          showToast('会話履歴をすべてコピーしました');
          return;
        }

        try {
          if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
            navigator.clipboard.writeText(text)
              .then(() => showToast('会話履歴をすべてコピーしました'))
              .catch(() => showToast('コピーに失敗しました'));
            return;
          }
        } catch (e) {}

        showToast('コピーに失敗しました');
      }

      // =========================================================
      // 11. イベントリスナー登録（最優先で確実に実行）
      // =========================================================

      function bindEvents() {
        // 設定パネル開閉
        if (dom.settingsToggleBtn && dom.apiSettingsDrawer) {
          dom.settingsToggleBtn.addEventListener('click', () => {
            const isHidden = dom.apiSettingsDrawer.classList.toggle('hidden');
            dom.settingsToggleBtn.setAttribute('aria-expanded', String(!isHidden));
          });
        }

        // APIキー表示・非表示トグル
        if (dom.toggleKeyEyeBtn && dom.apiKeyInput) {
          dom.toggleKeyEyeBtn.addEventListener('click', () => {
            const isPw = dom.apiKeyInput.type === 'password';
            dom.apiKeyInput.type = isPw ? 'text' : 'password';
            dom.toggleKeyEyeBtn.textContent = isPw ? '🙈 隠す' : '👁️ 表示';
          });
        }

        // モデル手動選択ドロップダウン変更
        if (dom.modelSelect) {
          dom.modelSelect.addEventListener('change', () => {
            saveSelectedModel(dom.modelSelect.value);
            if (selectedModel === 'auto') {
              showToast('翻訳モデル: 自動（高速・最優先）');
            } else {
              showToast('翻訳モデル固定: ' + selectedModel);
            }
          });
        }

        // 保存ボタン
        if (dom.saveApiBtn && dom.apiKeyInput) {
          dom.saveApiBtn.addEventListener('click', () => {
            const cleaned = normalizeKey(dom.apiKeyInput.value);
            if (!cleaned) {
              setInlineStatus('⚠️ APIキーを入力してください。', 'error');
              showToast('APIキーが空です');
              return;
            }
            saveApiKey(cleaned);
            setInlineStatus('✅ 保存しました（前後の空白は自動削除されました）。', 'success');
            showToast('APIキーを保存しました');
          });
        }

        // リセットボタン
        if (dom.resetApiBtn) {
          dom.resetApiBtn.addEventListener('click', () => {
            saveApiKey('');
            saveStickyModel('');
            saveSelectedModel('auto');
            discoveredModels = [];
            renderModelOptions();
            setInlineStatus('🗑️ APIキーとモデル設定をリセットしました。', 'default');
            showToast('設定をリセットしました');
          });
        }

        // 接続テスト＆モデル取得ボタン
        if (dom.testApiBtn) {
          dom.testApiBtn.addEventListener('click', async () => {
            const keyToTest = normalizeKey(dom.apiKeyInput ? dom.apiKeyInput.value : '') || apiKey;
            if (!keyToTest) {
              setInlineStatus('⚠️ テストするAPIキーを入力してください。', 'error');
              showToast('APIキーを入力してください');
              return;
            }

            saveApiKey(keyToTest);
            dom.testApiBtn.disabled = true;
            dom.testApiBtn.classList.add('opacity-60');
            setInlineStatus('🔄 利用可能モデルを取得して接続テスト中...', 'info');

            try {
              let discoveredCount = 0;
              try {
                const found = await discoverAvailableModels(keyToTest);
                discoveredCount = found.length;
              } catch (listErr) {
                if (isInvalidKeyError(listErr)) throw listErr;
              }

              const result = await callGeminiTranslate(
                'Translate "你好" into natural Japanese. Output ONLY the Japanese translation.',
                keyToTest,
                (msg) => setInlineStatus('🔄 ' + msg, 'info')
              );

              const countNote = discoveredCount > 0 ? (' / 検出モデル: ' + discoveredCount + '件') : '';
              setInlineStatus(
                '✅ 接続成功！（使用モデル: ' + result.model + countNote + ' / 応答: ' + result.text + '）',
                'success'
              );
              showToast('接続成功: ' + result.model);
            } catch (err) {
              const errMsg = err && err.message ? err.message : '接続に失敗しました';
              setInlineStatus('❌ 接続失敗: ' + errMsg, 'error');
              showToast('接続テストに失敗しました');
            } finally {
              dom.testApiBtn.disabled = false;
              dom.testApiBtn.classList.remove('opacity-60');
            }
          });
        }

        // モード選択変更（エンプティステート説明文・レイアウトを即座に切り替え）
        if (dom.modeSelect) {
          dom.modeSelect.addEventListener('change', () => {
            applyModeLayout();
            const meta = MODES[dom.modeSelect.value];
            if (meta) showToast('モード: ' + meta.pill);

            if (wantRecording && !pausedForTTS) {
              clearRecognitionTimers();
              pendingBackoffMs = 0;
              modeSwitchInProgress = true;
              updateMicButtonUI('reconnecting');
              if (recognition && (isRecognizing || isStarting)) {
                try {
                  recognition.stop();
                } catch (e) {
                  isRecognizing = false;
                  isStarting = false;
                  modeSwitchInProgress = false;
                  if (isIOS) {
                    wantRecording = false;
                    updateMicButtonUI('idle');
                    showToast('モードを切り替えました。もう一度「録音開始」をタップしてください');
                  } else {
                    scheduleRestart(RESTART_COOLDOWN_MS);
                  }
                }
              } else {
                modeSwitchInProgress = false;
                if (isIOS) {
                  wantRecording = false;
                  updateMicButtonUI('idle');
                } else {
                  scheduleRestart(RESTART_COOLDOWN_MS);
                }
              }
            }
          });
        }

        // 高密度モード：原文表示 ON/OFF
        if (dom.toggleOriginalBtn) {
          dom.toggleOriginalBtn.addEventListener('click', () => {
            showOriginal = !showOriginal;
            storageSet(KEY_SHOW_ORIGINAL, showOriginal ? 'on' : 'off');
            updateCompactToolbarUI();
            syncScrollBottomBtn();
            showToast(showOriginal ? '原文表示: ON' : '原文表示: OFF（日本語訳のみ）');
          });
        }

        // 高密度モード：文字サイズ 中/小
        if (dom.toggleFontSizeBtn) {
          dom.toggleFontSizeBtn.addEventListener('click', () => {
            compactSize = compactSize === 'sm' ? 'md' : 'sm';
            storageSet(KEY_COMPACT_SIZE, compactSize);
            updateCompactToolbarUI();
            syncScrollBottomBtn();
            showToast(compactSize === 'sm' ? '文字サイズ: 小（高密度）' : '文字サイズ: 中（標準）');
          });
        }

        // スマート自動スクロール監視 & 「↓ 最新へ」ボタン
        if (dom.transcriptScroll) {
          dom.transcriptScroll.addEventListener('scroll', syncScrollBottomBtn, { passive: true });
        }
        if (dom.scrollBottomBtn && dom.transcriptScroll) {
          dom.scrollBottomBtn.addEventListener('click', () => {
            dom.transcriptScroll.scrollTo({
              top: dom.transcriptScroll.scrollHeight,
              behavior: 'smooth'
            });
          });
        }

        // 録音開始 / 録音停止ボタン
        if (dom.micBtn) {
          dom.micBtn.addEventListener('click', () => {
            if (wantRecording || isRecognizing || isStarting) {
              stopRecording(true);
            } else {
              startRecording();
            }
          });
        }

        // 全コピーボタン
        if (dom.copyBtn && dom.transcriptList) {
          dom.copyBtn.addEventListener('click', () => {
            const cards = Array.from(dom.transcriptList.querySelectorAll('.utterance-card'));
            const blocks = cards.map((card) => {
              const time = card.dataset.time || '';
              const origEl = card.querySelector('.orig-text');
              const origPyEl = card.querySelector('.orig-pinyin');
              const transEl = card.querySelector('.trans-text');
              const transPyEl = card.querySelector('.trans-pinyin');

              const orig = origEl ? origEl.textContent.trim() : '';
              const origPy = origPyEl ? origPyEl.textContent.trim() : '';
              const trans = transEl ? transEl.textContent.trim() : '';
              const transPy = transPyEl ? transPyEl.textContent.trim() : '';

              const lines = [];
              if (time) lines.push('[' + time + ']');
              if (orig) lines.push(orig);
              if (origPy) lines.push(origPy);
              if (trans) lines.push(trans);
              if (transPy) lines.push(transPy);
              return lines.join('\n');
            }).filter(Boolean);

            if (blocks.length === 0) {
              showToast('コピーする会話履歴がありません');
              return;
            }
            copyHistoryText(blocks.join('\n\n'));
          });
        }

        // クリアボタン（履歴消去＋選択中モードの初期画面ガイドを再表示）
        if (dom.clearBtn && dom.transcriptList) {
          dom.clearBtn.addEventListener('click', () => {
            if (activeTtsBtn) {
              stopTTS(true);
            }
            const cards = dom.transcriptList.querySelectorAll('.utterance-card');
            if (cards.length === 0) {
              updateEmptyStateContent();
              if (dom.emptyStateCard) dom.emptyStateCard.classList.remove('hidden');
              showToast('クリアする履歴がありません');
              return;
            }
            cards.forEach((card) => card.remove());
            lastCommittedText = '';
            lastCommittedAt = 0;
            setInterimPreview('');
            updateEmptyStateContent();
            if (dom.emptyStateCard) dom.emptyStateCard.classList.remove('hidden');
            syncScrollBottomBtn();
            showToast('会話履歴をクリアしました');
          });
        }
      }

      // =========================================================
      // 12. アプリ初期化エントリーポイント
      // =========================================================

      function init() {
        // DOM要素をキャッシュ
        dom.settingsToggleBtn = document.getElementById('settings-toggle-btn');
        dom.apiStatusPill = document.getElementById('api-status-pill');
        dom.apiSettingsDrawer = document.getElementById('api-settings-drawer');
        dom.settingsEnvBadge = document.getElementById('settings-env-badge');
        dom.apiKeyInput = document.getElementById('api-key-input');
        dom.toggleKeyEyeBtn = document.getElementById('toggle-key-eye-btn');
        dom.modelSelect = document.getElementById('model-select');
        dom.stickyModelHint = document.getElementById('sticky-model-hint');
        dom.saveApiBtn = document.getElementById('save-api-btn');
        dom.resetApiBtn = document.getElementById('reset-api-btn');
        dom.testApiBtn = document.getElementById('test-api-btn');
        dom.apiInlineStatus = document.getElementById('api-inline-status');
        dom.modeSelect = document.getElementById('mode-select');
        dom.compactOptionsBar = document.getElementById('compact-options-bar');
        dom.toggleOriginalBtn = document.getElementById('toggle-original-btn');
        dom.toggleFontSizeBtn = document.getElementById('toggle-fontsize-btn');
        dom.transcriptScroll = document.getElementById('transcript-scroll');
        dom.transcriptList = document.getElementById('transcript-list');
        dom.emptyStateCard = document.getElementById('empty-state-card');
        dom.emptyStateIcon = document.getElementById('empty-state-icon');
        dom.emptyStateTitle = document.getElementById('empty-state-title');
        dom.emptyStateDesc = document.getElementById('empty-state-desc');
        dom.interimPreview = document.getElementById('interim-preview');
        dom.interimPreviewText = document.getElementById('interim-preview-text');
        dom.scrollBottomBtn = document.getElementById('scroll-bottom-btn');
        dom.micLiveStatus = document.getElementById('mic-live-status');
        dom.micLiveDot = document.getElementById('mic-live-dot');
        dom.micLiveText = document.getElementById('mic-live-text');
        dom.envModeBadge = document.getElementById('env-mode-badge');
        dom.micBtn = document.getElementById('mic-btn');
        dom.micBtnIcon = document.getElementById('mic-btn-icon');
        dom.micBtnLabel = document.getElementById('mic-btn-label');
        dom.copyBtn = document.getElementById('copy-btn');
        dom.clearBtn = document.getElementById('clear-btn');
        dom.toast = document.getElementById('toast');

        // 1. UIボタンのイベント登録を最優先で実行
        bindEvents();

        // 2. 端末プロファイルバッジ反映
        const envLabel = isIOS ? 'iOS最適化' : 'Android/PC最適化';
        if (dom.envModeBadge) dom.envModeBadge.textContent = envLabel;
        if (dom.settingsEnvBadge) dom.settingsEnvBadge.textContent = envLabel;

        // 3. 保存済み設定・レイアウト・初期ガイドの反映
        try {
          loadSettings();
        } catch (e) {}

        applyModeLayout();
        updateMicButtonUI('idle');

        // 4. 音声認識・音声合成の初期化（失敗してもUIを止めない）
        try {
          recognition = createRecognitionInstance();
        } catch (e) {
          recognition = null;
        }

        try {
          if ('speechSynthesis' in window) {
            refreshTtsVoices();
            if ('onvoiceschanged' in window.speechSynthesis) {
              window.speechSynthesis.onvoiceschanged = refreshTtsVoices;
            }
          }
        } catch (e) {}
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    })();
  </script>
</body>
